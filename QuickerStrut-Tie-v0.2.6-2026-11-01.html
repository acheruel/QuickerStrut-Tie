@charset "UTF-8";
/* SPDX-License-Identifier: GPL-3.0-or-later */
/* QuickerStrut&Tie — design tokens and layout. */
:root{
  --navy:#102d41;--navy-2:#0b2436;--navy-3:#061520;--ink:#17374b;--muted:#566e7c;--axis:#5d7684;
  --line:#dce5eb;--paper:#fff;--bg:#f0f4f7;--teal:#007f78;--mint:#56e0bb;--mint-soft:#d9f5eb;
  --amber:#b66c16;--blue:#3567ad;--coral:#c4513a;--ok:#1f7a5a;--warn:#9a6a12;--bad:#b23a2a;
  --strut:#7cb4ff;--tie:#ffc978;--load:#ff9b85;--react:#56e0bb;
  --shadow:0 2px 7px #15354a08;--radius:10px;
  font-family:"Segoe UI",Inter,Roboto,Arial,sans-serif;color:var(--ink);font-size:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:7px 12px;font-size:.875rem;font-weight:600;transition:background .15s,border-color .15s,color .15s}
button:hover:not(:disabled){background:#eef5f7}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input,select{width:100%;min-height:34px;border:1px solid #cbd8e1;border-radius:5px;background:#fff;color:var(--ink);padding:5px 8px;font-size:.84rem;font-variant-numeric:tabular-nums}
input.num{text-align:right}
input::placeholder{color:#9fb0ba}
input.num-err{border-color:#ba3838;background:#fff6f4}
input[type=checkbox]{width:16px;min-height:16px;accent-color:var(--teal);margin:0}
label{font-size:.875rem}
small{font-size:.75rem}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font:600 .6875rem "Segoe UI",Arial,sans-serif;color:var(--axis);border:1px solid #dbe5eb;border-radius:4px;padding:1px 5px;background:#f7fafb}

/* ---------- Top bar ---------- */
.topbar{height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-size:1.42rem;font-weight:650;letter-spacing:-.6px;white-space:nowrap}
.brand>div>span{font-weight:350;color:#9cdfcf}
.brand-logo{display:block;flex:none;width:40px;height:40px;filter:drop-shadow(0 2px 6px #0006)}
.top-warning{display:flex;align-items:center;gap:9px;margin:0;padding:6px 14px;border:1px solid #2f5268;border-radius:999px;color:#c9dbe4;font-size:.78rem;background:#0e2839}
.warning-symbol{width:15px;height:15px;border:1px solid #d7b25c;border-radius:50%;text-align:center;line-height:13px;color:#e9c46a;font-weight:bold;font-size:.625rem;flex:none}
.header-right{display:flex;gap:18px;align-items:center}
.release-info{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.release-info b{font-size:.85rem}
.release-info small{color:#9fb8c6}
.method-open{background:transparent;border-color:#3d6075;color:#e3eef3}
.method-open:hover:not(:disabled){background:#173a50}
.language{display:flex;border:1px solid #4b6373;border-radius:6px;padding:3px}
.language button{padding:5px 9px;border:0;background:transparent;color:#c5d8e0}
.language button.selected{background:#fff;color:var(--navy)}
.language button:hover:not(.selected){background:#1b3d52}
.github-link{color:#dbe9ef;display:flex}
.github-link svg{width:24px;height:24px}

/* ---------- Workspace ---------- */
.workspace{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;max-width:1880px;margin:0 auto;padding:18px 24px 12px}
.inputs{align-self:start;position:sticky;top:14px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);max-height:calc(100vh - 28px);display:flex;flex-direction:column;min-width:0}
.panel-heading{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
h1{font-size:1.05rem;margin:0;font-weight:650}
.text-button{border:0;padding:4px 0;background:none;color:var(--muted);font-size:.75rem}
.text-button:hover:not(:disabled){background:none;color:var(--teal)}
.project-bar{padding:0 18px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.pn-label{display:block;font-size:.6875rem;letter-spacing:1.1px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.pn-wrap{position:relative;display:block}
.pn-wrap input{font-weight:650;font-size:1rem;background:#f7fafb;padding-right:30px;min-height:40px}
.pn-pencil{position:absolute;right:9px;top:11px;width:17px;height:17px;color:var(--axis);pointer-events:none}
.dirty{font-size:.7rem;color:var(--amber);margin-left:6px}
.project-actions{display:flex;gap:8px;flex-wrap:wrap}
.qst-menu{position:relative}
.menu-button{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid #c9d8e1;border-radius:8px;background:#fff;color:var(--navy);font-size:.8125rem;font-weight:650;box-shadow:0 1px 2px #15354a0d}
.menu-button:hover{border-color:#8fb2c2;background:#f6fafb}
.qst-menu.open>.menu-button{border-color:var(--teal);background:#eefaf6;color:#00564f}
.menu-button .caret{font-size:.7rem;color:var(--axis);transition:transform .15s}
.qst-menu.open .caret{transform:rotate(180deg)}
.mi-ico{width:18px;height:18px;flex:none}
.menu-pop{display:none;position:absolute;z-index:60;left:0;top:calc(100% + 6px);min-width:300px;max-height:680px;overflow-y:auto;scrollbar-width:thin;padding:6px;background:#fff;border:1px solid #d3e0e7;border-radius:11px;box-shadow:0 10px 24px #0b1e2b26}
.qst-menu.open>.menu-pop{display:block;animation:menuIn .14s ease-out}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.menu-pop button{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--ink);text-align:left;font-size:.8125rem}
.menu-pop button:hover:not(:disabled),.menu-pop button:focus-visible{background:#eef6f8;outline:none}
.menu-pop button .mi-ico{color:var(--teal)}
.mi-text{display:flex;flex-direction:column;flex:1;min-width:0}
.mi-text b{font-weight:650}
.mi-text small{color:var(--muted);font-weight:400}
.menu-sep{height:1px;background:var(--line);margin:5px 4px}
.ex-thumb{width:58px;height:34px;flex:none;border-radius:6px;background:var(--navy);display:block}
.input-tabs{display:flex;padding:0 16px;border-bottom:1px solid var(--line);gap:16px}
.input-tabs button,.view-tabs button{border:0;border-radius:0;background:none;padding:11px 1px;color:var(--muted);border-bottom:2px solid transparent}
.input-tabs button:hover,.view-tabs button:hover{background:none!important;color:var(--ink)}
.input-tabs button.active,.view-tabs button.active{color:var(--teal);border-bottom-color:var(--teal)}
.input-tabs .count{font-size:.7rem;color:var(--axis);font-weight:500;margin-left:3px}
#input-content{padding:16px 18px 18px;overflow:auto;scrollbar-width:thin;min-height:0}
.section-label{font-size:.72rem;letter-spacing:1.2px;font-weight:700;margin:20px 0 10px;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.section-label:first-child{margin-top:0}
.field{display:block;margin-bottom:11px}
.field>span{display:flex;justify-content:space-between;margin-bottom:5px;color:var(--muted);font-size:.8rem}
.field>span em{font-style:normal;color:var(--axis);font-size:.72rem}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-row.three{grid-template-columns:1fr 1fr 1fr}
.unit-wrap{position:relative;display:block}
.unit-wrap input{padding-right:42px}
.unit-wrap i{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:.72rem;color:var(--axis);pointer-events:none}
.segmented{display:inline-flex;padding:3px;background:#e2eaf0;border-radius:8px;gap:2px}
.segmented button{border:0;background:transparent;padding:6px 12px;white-space:nowrap}
.segmented button.active{background:#fff;box-shadow:0 1px 4px #20374718;color:var(--navy)}
.segmented.full{display:flex}
.segmented.full button{flex:1}
.code-card{display:flex;flex-direction:column;gap:2px;text-align:left;padding:9px 11px!important}
.code-card small{font-weight:400;color:var(--muted)}
.note{padding:10px 12px;background:#eef5f7;border:1px solid #d3e5ec;border-radius:7px;font-size:.78rem;line-height:1.5;color:#486777}
.note b{color:var(--ink)}
.toggle-row{display:flex;align-items:center;gap:8px;font-size:.84rem;margin:8px 0}
.add-button{width:100%;border-style:dashed;color:var(--teal);margin:6px 0 4px}
.rows{display:flex;flex-direction:column;gap:8px}
.row-card{border:1px solid var(--line);border-radius:8px;padding:8px 9px;display:grid;gap:6px;transition:border-color .15s,box-shadow .15s;background:#fff}
.row-card.selected{border-color:var(--teal);box-shadow:0 0 0 2px #56e0bb55}
.row-card:hover{border-color:#b9cdd8}
.row-line{display:grid;gap:6px;align-items:center}
.row-node-1{grid-template-columns:44px 1fr 1fr 26px}
.row-node-2{grid-template-columns:1.25fr 1fr 1fr 0.9fr}
.row-mem-1{grid-template-columns:44px 1fr 1fr 1fr 26px}
.row-mem-2{grid-template-columns:0.75fr 1.45fr 1fr}
.row-card input,.row-card select{min-height:30px;padding:3px 6px;font-size:.8rem}
.row-card .mini{font-size:.62rem;color:var(--axis);display:block;margin:0 0 2px 2px;letter-spacing:.3px}
.tag{display:inline-flex;align-items:center;justify-content:center;height:24px;border-radius:6px;font-weight:700;font-size:.78rem;color:var(--navy);background:#eaf1f5;cursor:pointer}
.tag.strut{background:#e3eefe;color:#244f8e}
.tag.tie{background:#fdf0db;color:#7a4a0c}
.tag.zero{background:#eef1f3;color:#71818b}
.del{border:0;background:none;color:#97a9b4;font-size:1.05rem;padding:0;height:26px}
.del:hover:not(:disabled){color:var(--bad);background:none}
.bars-pick{display:grid;grid-template-columns:42px 10px minmax(62px,1fr);align-items:center;gap:3px}
.bars-row{grid-template-columns:1.6fr 1fr}
.bars-pick b{text-align:center;color:var(--axis);font-weight:400}
.input-footer{padding:10px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:.72rem;display:flex;justify-content:space-between;gap:8px}

/* ---------- Stage (canvas) ---------- */
.results{min-width:0;display:flex;flex-direction:column}
.stage{background:radial-gradient(120% 90% at 50% 30%,#123a52 0%,var(--navy-2) 55%,var(--navy-3) 100%);border-radius:var(--radius);color:#fff;overflow:hidden;box-shadow:0 6px 18px #0b1e2b22;position:relative;isolation:isolate}
.stage-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid #1d4458;flex-wrap:wrap}
.toolbox{display:flex;gap:4px;padding:3px;background:#0a2131;border:1px solid #1f4256;border-radius:10px}
.tool{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:#bcd3de;padding:6px 9px;border-radius:7px;font-size:.78rem;position:relative}
.tool svg{width:18px;height:18px}
.tool:hover:not(:disabled){background:#163a50;color:#fff}
.tool.active{background:#56e0bb;color:#062a24}
.tool .k{font-size:.62rem;opacity:.65;font-weight:700}
.tool .tl{display:none}
.stage-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dark-seg{display:inline-flex;padding:3px;background:#0a2131;border:1px solid #1f4256;border-radius:9px;gap:2px}
.dark-seg button{border:0;background:transparent;color:#bcd3de;padding:6px 11px;font-size:.78rem;border-radius:6px}
.dark-seg button:hover:not(:disabled){background:#163a50;color:#fff}
.dark-seg button.active{background:#e8f6f2;color:var(--navy)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #2a4f64;background:#0d283a;color:#bcd3de;padding:5px 9px;border-radius:999px;font-size:.74rem;font-weight:600}
.chip:hover:not(:disabled){background:#163a50;color:#fff}
.chip[aria-pressed=true]{border-color:#56e0bb;color:#d8fff3;background:#0f3a3a}
.chip svg{width:14px;height:14px}
.icon-chip{width:32px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid #2a4f64;background:#0d283a;color:#bcd3de;border-radius:8px}
.icon-chip:hover:not(:disabled){background:#163a50;color:#fff}
.icon-chip svg{width:16px;height:16px}
.canvas-wrap{position:relative;height:clamp(460px,64vh,820px);touch-action:none}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#canvas text{font-family:"Segoe UI",Inter,Roboto,Arial,sans-serif}
#canvas.tool-select{cursor:default}
#canvas.tool-node,#canvas.tool-member,#canvas.tool-outline{cursor:crosshair}
#canvas.tool-support,#canvas.tool-load,#canvas.tool-erase{cursor:pointer}
#canvas.panning{cursor:grabbing!important}
#canvas .hit-node,#canvas .hit-member{cursor:pointer}
#canvas.tool-select .hit-node{cursor:grab}
#canvas.dragging,#canvas.dragging *{cursor:grabbing!important}
.hud{position:absolute;left:12px;bottom:10px;display:flex;gap:10px;align-items:center;font-size:.72rem;color:#a9c3cf;pointer-events:none;font-variant-numeric:tabular-nums;flex-wrap:wrap;max-width:calc(100% - 330px)}
.hud b{color:#e6f3f7;font-weight:600}
.hud .hint{color:#7fa6b8}
.hud .sep{width:1px;height:12px;background:#2c5368}
.legend-hud{position:absolute;right:12px;bottom:10px;display:flex;gap:12px;align-items:center;font-size:.72rem;color:#bcd3de;background:#0a2131cc;border:1px solid #1f4256;padding:6px 10px;border-radius:8px;backdrop-filter:blur(4px)}
.legend-hud span{display:inline-flex;align-items:center;gap:6px}
.legend-hud svg{display:block}
.grad{width:110px;height:8px;border-radius:4px;background:linear-gradient(90deg,#56e0bb 0%,#a6e36b 40%,#ffd166 70%,#ff9f43 90%,#ff5d5d 100%)}
.banner{position:absolute;left:14px;top:12px;max-width:min(640px,calc(100% - 360px));padding:8px 14px;border-radius:9px;font-size:.8rem;line-height:1.4;display:flex;gap:9px;align-items:flex-start;box-shadow:0 6px 16px #0006;z-index:3}
.banner.bad{background:#3a1512ee;border:1px solid #a8483a;color:#ffd9d1}
.banner.warn{background:#3a2a0eee;border:1px solid #a8822f;color:#ffe9b8}
.banner b{color:#fff}
.empty-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.empty-hint div{background:#0a2131dd;border:1px dashed #2f5a70;border-radius:12px;padding:18px 22px;color:#bcd3de;font-size:.85rem;line-height:1.6;max-width:420px;text-align:center}
.empty-hint b{color:#56e0bb}
.tooltip{position:absolute;pointer-events:none;z-index:5;background:#f7fbfc;color:var(--ink);border-radius:8px;padding:7px 10px;font-size:.75rem;line-height:1.45;box-shadow:0 8px 20px #0007;min-width:150px;font-variant-numeric:tabular-nums}
.tooltip b{font-weight:700}
.tooltip .tt-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:3px}
.tooltip .tt-row{display:flex;justify-content:space-between;gap:14px;color:var(--muted)}
.tooltip .tt-row span:last-child{color:var(--ink);font-weight:600}

/* Inspector */
.inspector{position:absolute;right:12px;top:12px;width:318px;max-height:calc(100% - 64px);overflow:auto;background:#f9fcfdf5;color:var(--ink);border-radius:12px;box-shadow:0 12px 30px #0009;border:1px solid #ffffff40;z-index:4;scrollbar-width:thin;animation:insIn .16s ease-out}
@keyframes insIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.ins-head{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#f9fcfd;z-index:1}
.ins-badge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#fff;background:var(--navy);flex:none}
.ins-badge.strut{background:#2f64b0}
.ins-badge.tie{background:#b66c16}
.ins-badge.zero{background:#7f909a}
.ins-title{flex:1;min-width:0}
.ins-title b{display:block;font-size:.95rem}
.ins-title small{color:var(--muted)}
.ins-close{border:0;background:none;font-size:1.25rem;color:var(--axis);padding:2px 6px}
.ins-body{padding:12px 14px 14px}
.ins-body .field{margin-bottom:9px}
.ins-body .field>span{font-size:.74rem}
.ins-body input,.ins-body select{min-height:32px}
.ins-result{margin-top:10px;border-radius:9px;background:#fff;border:1px solid var(--line);overflow:hidden}
.ins-result .big{display:flex;align-items:baseline;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.ins-result .big b{font-size:1.45rem;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.ins-result .big small{color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 12px;font-size:.78rem;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-weight:600}
.steps{margin:0;padding:9px 12px 11px;border-top:1px solid var(--line);font-size:.74rem;line-height:1.65;color:#3d5868;background:#fbfdfe}
.steps div{white-space:normal}
.steps .eq{font-family:Cambria,"Cambria Math","Times New Roman",serif;font-size:.86rem;color:var(--ink)}
.steps .cl{float:right;color:var(--axis);font-size:.68rem}
.ubar{position:relative;height:8px;border-radius:4px;background:#e7eef2;overflow:hidden;margin:2px 12px 10px}
.ubar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.status{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px}
.status.ok{background:#dff5ea;color:var(--ok)}
.status.warn{background:#fdf0d5;color:var(--warn)}
.status.bad{background:#fde4df;color:var(--bad)}
.status.na{background:#eef1f3;color:#71818b}
.ins-hint{font-size:.74rem;color:var(--muted);line-height:1.5;margin-top:8px}

/* ---------- Metrics and results ---------- */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:14px}
.metric{background:#fff;padding:11px 15px;border:0;border-radius:0;text-align:left;min-width:0;font-weight:400}
button.metric:hover:not(:disabled){background:#f6fafb}
.metric-label{font-size:.6875rem;letter-spacing:.8px;font-weight:650;text-transform:uppercase;color:var(--muted)}
.metric-value{display:flex;gap:7px;align-items:baseline;margin-top:4px;font-size:1.48rem;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.6px}
.metric-value small{font-size:.75rem;font-weight:400;letter-spacing:0;color:var(--muted)}
.metric-location{font-size:.7rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:12px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.view-tabs{display:flex;gap:20px}
.result-view{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 9px 9px;padding:12px 16px 14px;margin-bottom:10px}
.table-scroll{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:.78rem;font-variant-numeric:tabular-nums;white-space:nowrap}
th{text-align:right;padding:9px 8px;background:#edf3f6;color:#547285;font-weight:600;position:sticky;top:0}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td{text-align:right;padding:7px 8px;border-bottom:1px solid #edf2f5}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#f5fafb}
tbody tr.selected td{background:#e6f7f1}
tr.group td{background:#f7fafb;color:var(--muted);font-weight:700;font-size:.7rem;letter-spacing:1px;text-transform:uppercase;cursor:default;text-align:left}
td .cell-ubar{display:inline-block;vertical-align:middle;width:70px;height:7px;background:#e7eef2;border-radius:4px;overflow:hidden;margin-right:8px;position:relative}
td .cell-ubar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.table-note{font-size:.72rem;color:var(--muted);margin:10px 2px 0;line-height:1.5}
.result-footer{display:flex;justify-content:space-between;font-size:.6875rem;color:var(--muted);padding:6px 2px 14px;gap:12px;flex-wrap:wrap}

/* ---------- Dialogs ---------- */
dialog{border:0;border-radius:14px;padding:0;box-shadow:0 20px 50px #0b1e2b55;max-width:min(860px,calc(100vw - 24px));width:860px;color:var(--ink)}
dialog::backdrop{background:#061520aa;backdrop-filter:blur(2px)}
.dlg-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.dlg-head b{display:block;font-size:1.05rem}
.dlg-head small{color:var(--muted)}
.dlg-head .ins-close{margin-left:auto}
.dlg-body{padding:6px 24px 22px;max-height:72vh;overflow:auto;font-size:.88rem;line-height:1.6}
.dlg-body h3{font-size:.95rem;margin:18px 0 6px;color:var(--navy)}
.dlg-body .eq{font-family:Cambria,"Cambria Math","Times New Roman",serif;font-size:1rem;background:#f4f8fa;border-radius:7px;padding:8px 12px;margin:6px 0;display:block}
.dlg-body table{white-space:normal}
.dlg-body td,.dlg-body th{text-align:left}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.primary:hover:not(:disabled){background:#006a64}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:9px;font-size:.84rem;box-shadow:0 10px 26px #0006;opacity:0;transition:all .25s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Templates dialog ---------- */
.tpl-dialog{width:1040px}
.tpl-body{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:14px 18px;max-height:72vh;overflow:auto}
.tpl-kinds{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.tpl-kind{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:9px 11px;border-radius:9px}
.tpl-kind small{font-weight:400;color:var(--muted)}
.tpl-kind.active{border-color:var(--teal);background:#eefaf6;box-shadow:0 0 0 2px #56e0bb44}
.tpl-form .field{margin-bottom:8px}
.tpl-preview{display:flex;flex-direction:column;gap:10px;min-width:0}
.tpl-svg{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.tpl-svg svg{width:100%;height:auto;display:block}
.tpl-info{font-size:.8rem;color:var(--muted);line-height:1.55}
.tpl-info b{color:var(--ink)}
.tpl-info .bad{color:var(--bad)}

/* ---------- Responsive ---------- */
@media (max-width:1380px){.top-warning{display:none}}
@media (max-width:1180px){
  .workspace{grid-template-columns:1fr;padding:12px}
  .inputs{position:static;max-height:none;order:2}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .inspector{width:290px}
}
@media (max-width:760px){
  .tpl-body{grid-template-columns:1fr}
  .topbar{padding:0 12px;height:56px}.brand{font-size:1.15rem}.release-info,.method-open .lbl{display:none}
  .header-right{gap:10px}
  .canvas-wrap{height:68vh}
  .inspector{left:8px;right:8px;width:auto;top:auto;bottom:44px;max-height:48%}
  .hud{max-width:100%}.legend-hud{display:none}
  .banner{max-width:calc(100% - 20px)}
  .tool .k{display:none}
  .metrics{grid-template-columns:1fr 1fr}
}
/* ---------- Galaxy Z Fold 8 unfolded in landscape (~816 × 536 CSS px) and other
   wide, short screens: slim header, narrow side panel that scrolls on its own,
   vertical tool column inside the canvas, canvas sized from the screen height. */
@media (orientation:landscape) and (max-height:620px) and (min-width:700px){

  .brand-logo{width:30px;height:30px}
  .top-warning,.release-info{display:none}
  .header-right{gap:10px}
  .method-open{padding:5px 9px;font-size:.75rem}

  .github-link svg{width:20px;height:20px}
  .workspace{grid-template-columns:250px minmax(0,1fr);gap:10px;padding:8px 10px}
  .inputs{position:sticky;top:8px;order:0;max-height:calc(100svh - 16px)}
  .panel-heading{padding:10px 12px 6px}
  h1{font-size:.95rem}
  .project-bar{padding:0 12px 8px;gap:7px}
  .pn-label{margin-bottom:3px}
  .pn-wrap input{min-height:34px;font-size:.9rem}
  .menu-button{padding:5px 9px;font-size:.75rem}
  .input-tabs{padding:0 10px;gap:10px}
  .input-tabs button{padding:8px 1px;font-size:.78rem}
  #input-content{padding:10px 12px}
  .input-footer{display:none}
  .field-row{gap:7px}
  .row-node-1{grid-template-columns:36px 1fr 1fr 22px}
  .row-mem-1{grid-template-columns:36px 1fr 1fr 1fr 22px}
  .stage-top{padding:6px 8px;gap:6px;flex-wrap:nowrap}
  .stage-right{gap:5px;flex-wrap:nowrap;margin-left:auto}
  .toolbox{position:absolute;left:8px;top:54px;z-index:4;flex-direction:column;gap:2px;padding:3px;box-shadow:0 6px 16px #0006}
  .tool{padding:7px;justify-content:center}
  .tool .k{display:none}
  .dark-seg button{padding:5px 8px;font-size:.72rem}
  .chip{padding:5px 7px}
  .chip .cl{display:none}
  .icon-chip{width:30px;height:28px}
  .canvas-wrap{height:calc(100svh - 46px - 16px - 44px);min-height:300px}
  .hud{left:56px;bottom:6px;font-size:.66rem;gap:7px}
  .hud .hint{display:none}
  .legend-hud{display:none}
  .banner{left:56px;max-width:calc(100% - 320px);font-size:.74rem;padding:6px 10px}
  .inspector{top:8px;right:8px;width:244px;max-height:calc(100% - 16px);font-size:.92em;border-radius:10px}
  .ins-head{padding:9px 11px 8px}
  .ins-badge{width:30px;height:30px}
  .ins-body{padding:9px 11px 11px}
  .ins-result .big b{font-size:1.2rem}
  .steps{font-size:.7rem}
  .bars-row{grid-template-columns:1fr}
  .metrics{margin-top:8px}
  .metric{padding:7px 10px}
  .metric-label{font-size:.62rem;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .metric-value{font-size:1.1rem}
  .metric-value>span[style*="1.1rem"]{font-size:.95rem!important}
  .chart-toolbar{margin-top:6px}
  .view-tabs{gap:12px}
  .view-tabs button{padding:8px 1px;font-size:.8rem}
  .result-view{padding:8px 10px 10px}
  dialog{max-height:calc(100svh - 12px)}
  .tpl-body{grid-template-columns:250px minmax(0,1fr);max-height:calc(100svh - 130px);padding:10px}
  .dlg-body{max-height:calc(100svh - 120px)}
}
@media (pointer:coarse){
  .input-tabs button,.view-tabs button{min-height:40px}
  .dark-seg button,.tool{min-height:36px;min-width:36px}
  .chip,.icon-chip{min-height:34px}
  .menu-pop button{min-height:42px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Printed report ---------- */
#report{display:none}
@media print{
  @page{size:letter;margin:14mm}
  body{background:#fff}

  #report{display:block;color:#111;font-size:10.5pt;line-height:1.45}
  #report h1{font-size:18pt;margin:0 0 4px}

  #report .rp-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #102d41;padding-bottom:8px;margin-bottom:10px}
  #report .rp-brand{font-weight:700;font-size:13pt;color:#102d41}

  #report td{padding:4px 6px}

  #report .rp-calc td,#report .rp-calc th{text-align:left;vertical-align:top}
  #report .rp-calc td:last-child{text-align:right;white-space:nowrap}
  #report .rp-eq{font-family:Cambria,"Times New Roman",serif}
  #report .rp-ok{color:#1f7a5a;font-weight:700}

  #report .rp-disclaimer{margin-top:14px;padding:8px 10px;border:1px solid #d7b25c;background:#fff8e6!important;font-size:8.8pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #report .rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:9.5pt}
}

<script>/* js/solver.js */
// SPDX-License-Identifier: GPL-3.0-or-later
/* QuickerStrut&Tie — 2D pin-jointed truss solver (direct stiffness method).
 *
 * Units: coordinates in m, forces in kN, widths/thickness in mm, areas in mm²,
 * stresses in MPa. Axial force N > 0 is tension (tie), N < 0 compression (strut).
 *
 * Axial stiffness of each bar: struts EA = Ec·w·b, ties EA = Es·As. For a
 * statically determinate model the forces do not depend on EA; for an
 * indeterminate model the bar roles (strut/tie) are iterated until stable.
 */
(function (root) {
  'use strict';

  var ZERO_FORCE_KN = 0.05; // |N| below this is reported as a zero-force member

  function concreteModulus(code, fc) {
    // A23.3 8.6.2.3 / S6 8.4.1.7 simplified expressions for normal-density concrete.
    if (code === 'S6') return 3000 * Math.sqrt(fc) + 6900;
    return 4500 * Math.sqrt(fc);
  }

  function supportDofs(type) {
    if (type === 'pin') return [true, true];
    if (type === 'ry') return [false, true];
    if (type === 'rx') return [true, false];
    return [false, false];
  }

  function memberGeometry(model) {
    var index = {};
    model.nodes.forEach(function (n, k) { index[n.id] = k; });
    return model.members.map(function (m) {
      var a = index[m.i], b = index[m.j];
      if (a === undefined || b === undefined) return { error: 'missingNode', member: m.id };
      var A = model.nodes[a], B = model.nodes[b];
      var dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy);
      if (!(L > 1e-6)) return { error: 'zeroLength', member: m.id };
      return { a: a, b: b, L: L, c: dx / L, s: dy / L };
    });
  }

  // Gaussian elimination with partial pivoting on a dense copy. Returns the
  // solution or {singular: column} for the first column without a usable pivot.
  function linearSolve(K, F) {
    var n = F.length, A = K.map(function (r) { return r.slice(); }), x = F.slice();
    var scale = 0;
    for (var d = 0; d < n; d++) scale = Math.max(scale, Math.abs(A[d][d]));
    var tol = Math.max(scale, 1e-30) * 1e-10;
    var perm = [];
    for (var p = 0; p < n; p++) perm.push(p);
    for (var k = 0; k < n; k++) {
      var piv = k, best = Math.abs(A[k][k]);
      for (var r = k + 1; r < n; r++) if (Math.abs(A[r][k]) > best) { best = Math.abs(A[r][k]); piv = r; }
      if (best < tol) return { singular: k };
      if (piv !== k) { var t = A[k]; A[k] = A[piv]; A[piv] = t; var tx = x[k]; x[k] = x[piv]; x[piv] = tx; }
      var akk = A[k][k];
      for (var i = k + 1; i < n; i++) {
        var f = A[i][k] / akk;
        if (f === 0) continue;
        var Ai = A[i], Ak = A[k];
        for (var j = k; j < n; j++) Ai[j] -= f * Ak[j];
        x[i] -= f * x[k];
      }
    }
    for (var i2 = n - 1; i2 >= 0; i2--) {
      var sum = x[i2];
      for (var j2 = i2 + 1; j2 < n; j2++) sum -= A[i2][j2] * x[j2];
      x[i2] = sum / A[i2][i2];
    }
    return { x: x };
  }

  function axialStiffness(model, m, isTie, Ec) {
    var mat = model.material, b = mat.b;
    if (isTie) {
      var As = m.As > 0 ? m.As : 1000;
      return mat.Es * As / 1000; // kN
    }
    var w = m.w > 0 ? m.w : 100;
    return Ec * w * b / 1000; // kN
  }

  function solve(model) {
    var nodes = model.nodes, members = model.members, nn = nodes.length, nd = nn * 2;
    var out = { ok: false, nodes: nn, members: members.length };
    if (!nn) { out.error = 'empty'; return out; }
    var geo = memberGeometry(model);
    for (var g = 0; g < geo.length; g++) if (geo[g].error) { out.error = geo[g].error; out.member = geo[g].member; return out; }

    var fixed = [], nReactions = 0;
    nodes.forEach(function (n) {
      var f = supportDofs(n.support);
      fixed.push(f[0], f[1]);
      nReactions += (f[0] ? 1 : 0) + (f[1] ? 1 : 0);
    });
    var F = new Array(nd).fill(0);
    nodes.forEach(function (n, k) { F[2 * k] = Number(n.fx) || 0; F[2 * k + 1] = Number(n.fy) || 0; });
    out.indeterminacy = members.length + nReactions - 2 * nn;
    var free = [];
    for (var d = 0; d < nd; d++) if (!fixed[d]) free.push(d);
    var Ec = concreteModulus(model.code, model.material.fc);
    out.Ec = Ec;

    // Initial roles: explicit roles, otherwise strut.
    var tie = members.map(function (m) { return m.role === 'tie'; });
    var N, u, EA, iter = 0, converged = false, K;
    while (iter < 12) {
      iter++;
      EA = members.map(function (m, k) { return axialStiffness(model, m, tie[k], Ec); });
      K = [];
      for (var r = 0; r < nd; r++) K.push(new Array(nd).fill(0));
      members.forEach(function (m, k) {
        var G = geo[k], kk = EA[k] / G.L, c = G.c, s = G.s;
        var e = [[c * c, c * s], [c * s, s * s]];
        var dofs = [2 * G.a, 2 * G.a + 1, 2 * G.b, 2 * G.b + 1];
        for (var p = 0; p < 4; p++) for (var q = 0; q < 4; q++) {
          var sign = (p < 2) === (q < 2) ? 1 : -1;
          K[dofs[p]][dofs[q]] += sign * kk * e[p % 2][q % 2];
        }
      });
      var Kr = free.map(function (i) { return free.map(function (j) { return K[i][j]; }); });
      var Fr = free.map(function (i) { return F[i]; });
      u = new Array(nd).fill(0);
      if (free.length) {
        var sol = linearSolve(Kr, Fr);
        if (sol.singular !== undefined) {
          var dof = free[sol.singular];
          out.error = 'mechanism';
          out.mechanismNode = nodes[Math.floor(dof / 2)].id;
          out.mechanismDir = dof % 2 ? 'y' : 'x';
          return out;
        }
        free.forEach(function (dd, k2) { u[dd] = sol.x[k2]; });
      }
      N = members.map(function (m, k) {
        var G = geo[k];
        var du = u[2 * G.b] - u[2 * G.a], dv = u[2 * G.b + 1] - u[2 * G.a + 1];
        return EA[k] / G.L * (G.c * du + G.s * dv);
      });
      var next = members.map(function (m, k) {
        if (m.role === 'tie') return true;
        if (m.role === 'strut') return false;
        return N[k] > ZERO_FORCE_KN;
      });
      var same = next.every(function (v, k) { return v === tie[k]; });
      tie = next;
      if (same) { converged = true; break; }
    }

    // Reactions R = K·u − F at restrained dofs; residual at free dofs.
    var Ku = new Array(nd).fill(0);
    for (var i = 0; i < nd; i++) { var sum = 0; for (var j = 0; j < nd; j++) sum += K[i][j] * u[j]; Ku[i] = sum; }
    var reactions = [], residual = 0, sumFx = 0, sumFy = 0, loadScale = 0;
    nodes.forEach(function (n, k) {
      sumFx += F[2 * k]; sumFy += F[2 * k + 1];
      loadScale = Math.max(loadScale, Math.abs(F[2 * k]), Math.abs(F[2 * k + 1]));
      var rx = fixed[2 * k] ? Ku[2 * k] - F[2 * k] : 0, ry = fixed[2 * k + 1] ? Ku[2 * k + 1] - F[2 * k + 1] : 0;
      if (!fixed[2 * k]) residual = Math.max(residual, Math.abs(Ku[2 * k] - F[2 * k]));
      if (!fixed[2 * k + 1]) residual = Math.max(residual, Math.abs(Ku[2 * k + 1] - F[2 * k + 1]));
      if (fixed[2 * k] || fixed[2 * k + 1]) reactions.push({ node: n.id, rx: rx, ry: ry, fixedX: fixed[2 * k], fixedY: fixed[2 * k + 1] });
    });
    var sumRx = 0, sumRy = 0;
    reactions.forEach(function (R) { sumRx += R.rx; sumRy += R.ry; });

    out.ok = true;
    out.converged = converged;
    out.iterations = iter;
    out.u = u;
    out.reactions = reactions;
    out.residual = residual;
    out.globalResidual = Math.hypot(sumFx + sumRx, sumFy + sumRy);
    out.loadScale = loadScale;
    out.sumLoads = { fx: sumFx, fy: sumFy };
    out.forces = members.map(function (m, k) {
      var n = Math.abs(N[k]) < ZERO_FORCE_KN ? 0 : N[k];
      return {
        id: m.id, N: n, L: geo[k].L, c: geo[k].c, s: geo[k].s, EA: EA[k],
        kind: n > 0 ? 'tie' : n < 0 ? 'strut' : 'zero'
      };
    });
    return out;
  }

  var api = { solve: solve, concreteModulus: concreteModulus, linearSolve: linearSolve, supportDofs: supportDofs, ZERO_FORCE_KN: ZERO_FORCE_KN };
  root.QST = root.QST || {};
  root.QST.solver = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/csa.js */
// SPDX-License-Identifier: GPL-3.0-or-later
/* QuickerStrut&Tie — strut-and-tie verification to CSA S6 (bridges) and
 * CSA A23.3 (buildings).
 *
 * Struts : Cr = φc·fcu·Acs, fcu = f'c / (0.8 + 170·ε1) ≤ 0.85·f'c (A23.3) or α1·f'c (S6),
 *          ε1 = εs + (εs + 0.002)·cot²θs  (θs = smallest strut–tie angle).
 * Ties   : Tr = φs·fy·Ast.
 * Nodes  : face stresses ≤ 0.85 / 0.75 / 0.65 ·φc·f'c (A23.3) or
 *          α1 / 0.88 α1 / 0.76 α1 ·φc·f'c (S6), for CCC / CCT / CTT.
 * Crack control: orthogonal grid, ρ ≥ ρmin each way, spacing ≤ 300 mm.
 *
 * Clause numbers and factors live in CODES so they can be checked and
 * corrected in one place.
 */
(function (root) {
  'use strict';

  // S6: α1 = 0.85 − 0.0015 f′c ≥ 0.67 caps the strut stress (α1 f′c) and sets the
  // nodal limits α1, 0.88 α1 and 0.76 α1 (× φc f′c). A23.3: 0.85 f′c, 0.85/0.75/0.65.
  function alpha1(fc) { return Math.max(0.67, 0.85 - 0.0015 * fc); }
  var CODES = {
    S6: {
      name: 'CSA S6',
      phiC: 0.75, phiS: 0.90,
      strutCap: function (fc) { return alpha1(fc); },
      node: function (type, fc) { var a = alpha1(fc); return { CCC: a, CCT: 0.88 * a, CTT: 0.76 * a }[type]; },
      nodeText: { CCC: 'α1', CCT: '0,88 α1', CTT: '0,76 α1' },
      rhoMin: 0.003, sMax: 300, maxFaceArea: 1500,
      clause: { phi: '8.4.6', strut: '8.10.3', fcu: '8.10.3.3', tie: '8.10.4.1', node: '8.10.5.1', crack: '8.10.5', anchor: '8.10.4.2 · A23.3 12.2.3 / 12.5' }
    },
    A23: {
      name: 'CSA A23.3',
      phiC: 0.65, phiS: 0.85,
      strutCap: function () { return 0.85; },
      node: function (type) { return { CCC: 0.85, CCT: 0.75, CTT: 0.65 }[type]; },
      nodeText: { CCC: '0,85', CCT: '0,75', CTT: '0,65' },
      rhoMin: 0.002, sMax: 300, maxFaceArea: null,
      clause: { phi: '8.4.2 / 8.4.3', strut: '11.4.2', fcu: '11.4.2.3', tie: '11.4.3.1', node: '11.4.4.1', crack: '11.4.5', anchor: '11.4.3.2 · 12.2.3 / 12.5' }
    }
  };

  // CSA G30.18 bar designations: nominal area (mm²) and diameter (mm).
  var BARS = {
    '10M': { A: 100, d: 11.3 }, '15M': { A: 200, d: 16.0 }, '20M': { A: 300, d: 19.5 },
    '25M': { A: 500, d: 25.2 }, '30M': { A: 700, d: 29.9 }, '35M': { A: 1000, d: 35.7 },
    '45M': { A: 1500, d: 43.7 }, '55M': { A: 2500, d: 56.4 }
  };

  // Tie anchorage types (member.anchor), in the order offered in the inspector.
  var ANCHORS = ['straight', 'hook', 'plate', 'stirrup', 'continuous'];

  function factors(model) {
    var c = CODES[model.code] || CODES.S6, m = model.material;
    return {
      code: c,
      phiC: m.phiC > 0 ? Number(m.phiC) : c.phiC,
      phiS: m.phiS > 0 ? Number(m.phiS) : c.phiS
    };
  }

  function memberArea(m) {
    if (m.bars && m.bars.n > 0 && BARS[m.bars.size]) return m.bars.n * BARS[m.bars.size].A;
    return Number(m.As) || 0;
  }

  // Effective area used by the solver and the checks (bars override As).
  function normalize(model) {
    model.members.forEach(function (m) { m.As = memberArea(m); });
    return model;
  }

  function strutFcu(fc, epsS, theta, cap) {
    // theta in radians, acute angle between the strut and the adjoining tie;
    // cap: limiting ratio fcu / f′c (0.85 for A23.3, α1 for S6).
    cap = cap === undefined ? 0.85 : cap;
    var cot = 1 / Math.tan(theta);
    var eps1 = epsS + (epsS + 0.002) * cot * cot;
    var raw = fc / (0.8 + 170 * eps1);
    return { eps1: eps1, raw: raw, fcu: Math.min(raw, cap * fc), capped: raw >= cap * fc, cap: cap };
  }

  function acuteAngle(fa, fb) {
    var dot = Math.abs(fa.c * fb.c + fa.s * fb.s);
    return Math.acos(Math.min(1, dot));
  }

  function check(model, result) {
    var out = { ok: false, members: [], nodes: [], crack: null, governing: null, maxUtil: 0, warnings: [] };
    if (!result || !result.ok) return out;
    var mat = model.material, fc = Number(mat.fc), fy = Number(mat.fy), Es = Number(mat.Es), b = Number(mat.b);
    var F = factors(model), code = F.code, cap = code.strutCap(fc);
    var byId = {}, memberById = {}, nodeById = {};
    result.forces.forEach(function (f) { byId[f.id] = f; });
    model.members.forEach(function (m) { memberById[m.id] = m; });
    model.nodes.forEach(function (n) { nodeById[n.id] = n; });
    var atNode = {};
    model.nodes.forEach(function (n) { atNode[n.id] = []; });
    model.members.forEach(function (m) { atNode[m.i].push(m); atNode[m.j].push(m); });

    function tieStrain(m, f) {
      var As = memberArea(m);
      if (mat.epsMode === 'yield') return fy / Es;
      if (!(As > 0)) return fy / Es;
      return f.N * 1000 / (Es * As);
    }

    // --- Ties ---------------------------------------------------------------
    var tieInfo = {};
    model.members.forEach(function (m) {
      var f = byId[m.id];
      if (f.kind !== 'tie') return;
      var As = memberArea(m), Tr = F.phiS * fy * As / 1000;
      var util = As > 0 ? f.N / Tr : Infinity;
      var eps = tieStrain(m, f);
      tieInfo[m.id] = { eps: eps };
      out.members.push({
        id: m.id, kind: 'tie', demand: f.N, capacity: Tr, util: util, As: As,
        asReq: f.N * 1000 / (F.phiS * fy), epsS: eps, clause: code.clause.tie
      });
    });

    // --- Struts -------------------------------------------------------------
    model.members.forEach(function (m) {
      var f = byId[m.id];
      if (f.kind !== 'strut') return;
      var C = -f.N, w = Number(m.w) || 0, ends = [];
      [m.i, m.j].forEach(function (nid) {
        var best = null;
        atNode[nid].forEach(function (o) {
          if (o.id === m.id) return;
          var fo = byId[o.id];
          if (fo.kind !== 'tie') return;
          // A tie on the strut's line (within 5°) does not cross it.
          if (acuteAngle(f, fo) < 5 * Math.PI / 180) return;
          // Each adjoining tie is evaluated; the lowest fcu (smallest angle,
          // largest tie strain) governs.
          var th = acuteAngle(f, fo), eps = tieInfo[o.id].eps;
          var r = strutFcu(fc, eps, th, cap);
          var cand = { tie: o.id, theta: th, epsS: eps, eps1: r.eps1, fcuRaw: r.raw, fcu: r.fcu, capped: r.capped };
          if (!best || cand.fcu < best.fcu - 1e-9 || (Math.abs(cand.fcu - best.fcu) <= 1e-9 && th < best.theta)) best = cand;
        });
        if (best) {
          ends.push({ node: nid, tie: best.tie, theta: best.theta, epsS: best.epsS, eps1: best.eps1, fcuRaw: best.fcuRaw, fcu: best.fcu, capped: best.capped });
        } else {
          ends.push({ node: nid, tie: null, theta: null, epsS: 0, eps1: 0, fcuRaw: fc / 0.8, fcu: cap * fc, capped: true });
        }
      });
      var gov = ends[0].fcu <= ends[1].fcu ? ends[0] : ends[1];
      var Cr = F.phiC * gov.fcu * w * b / 1000;
      out.members.push({
        id: m.id, kind: 'strut', demand: C, capacity: Cr, util: Cr > 0 ? C / Cr : Infinity,
        w: w, wReq: gov.fcu > 0 ? C * 1000 / (F.phiC * gov.fcu * b) : Infinity,
        ends: ends, governingEnd: gov.node, fcu: gov.fcu, eps1: gov.eps1, theta: gov.theta, epsS: gov.epsS,
        clause: code.clause.strut + ' · ' + code.clause.fcu
      });
    });
    model.members.forEach(function (m) {
      if (byId[m.id].kind === 'zero') out.members.push({ id: m.id, kind: 'zero', demand: 0, capacity: null, util: 0, clause: '' });
    });

    // --- Nodal zones --------------------------------------------------------
    var reactionById = {};
    result.reactions.forEach(function (R) { reactionById[R.node] = R; });
    model.nodes.forEach(function (n) {
      var ties = [], faces = [];
      atNode[n.id].forEach(function (m) {
        var f = byId[m.id];
        if (f.kind === 'tie') ties.push({ m: m, f: f });
        if (f.kind === 'strut') {
          var w = Number(m.w) || 0;
          faces.push({ kind: 'strut', ref: m.id, force: -f.N, width: w, stress: w > 0 ? -f.N * 1000 / (w * b) : Infinity });
        }
      });
      // Distinct tie directions (collinear ties through a node count once).
      var dirs = [];
      ties.forEach(function (t) {
        var same = dirs.some(function (d) { return acuteAngle(d, t.f) < 5 * Math.PI / 180; });
        if (!same) dirs.push(t.f);
      });

<script>/* js/templates.js */
// SPDX-License-Identifier: GPL-3.0-or-later
/* QuickerStrut&Tie — parametric bridge templates, automatic sizing and pile
 * head loads export.
 *
 * Templates (geometry in m, loads in kN, factored):
 *   dappedEnd   about réduit / demi-joint, orthogonal model, half span with symmetry
 *   bentCap     multi-column bent cap, truss with diagonals towards the columns
 *   pileCap     pile cap on 2, 3 or 4 piles, 2D elevation (see pileMap / tie3D)
 */
(function (root) {
  'use strict';
  var Q = root.QST || {};
  var solver = Q.solver || (typeof require !== 'undefined' ? require('./solver.js') : null);
  var csa = Q.csa || (typeof require !== 'undefined' ? require('./csa.js') : null);
  var examples = Q.examples || (typeof require !== 'undefined' ? require('./examples.js') : null);

  function r6(v) { return Math.round(v * 1e6) / 1e6; }
  function node(id, x, y, o) {
    o = o || {};
    return { id: id, x: r6(x), y: r6(y), support: o.support || null, fx: o.fx || 0, fy: r6(o.fy || 0), bearing: o.bearing || 0 };
  }
  function bar(id, i, j, o) {
    o = o || {};
    return { id: id, i: i, j: j, role: 'auto', w: o.w || 200, bars: o.tie ? { n: 4, size: '20M' } : null, As: 0, anchor: o.anchor || 'hook', db: 0 };
  }

  var DEFAULTS = {
    dappedEnd: { h: 1.2, hn: 0.6, ln: 0.45, a: 0.2, half: 3.0, R: 600, n: 3, b: 1000, fc: 35 },
    bentCap: { ncol: 3, spacing: 6.0, overhang: 1.8, h: 1.5, colWidth: 1.0, nGirders: 5, girderSpacing: 3.2, P: 1500, b: 1200, fc: 35 },
    pileCap: { np: 4, s: 2.7, edge: 0.75, h: 1.6, colWidth: 1.0, pileD: 0.6, P: 8000, fc: 30 }
  };

  // ---------------------------------------------------------------- about réduit
  function dappedEnd(p) {
    p = Object.assign({}, DEFAULTS.dappedEnd, p || {});
    var h = p.h, hn = p.hn, ln = p.ln, c = Math.min(0.1, 0.07 * h), yNib = h - hn + c;
    var xh = ln + Math.max(0.1, 0.08 * h), n = Math.max(1, Math.round(p.n));
    var errors = [];
    if (!(hn > 0.2 * h && hn < 0.9 * h)) errors.push('hn');
    if (!(p.a > 0 && p.a < ln)) errors.push('a');
    if (!(p.half > xh + 0.3)) errors.push('half');
    var xs = [];
    for (var i = 1; i <= n; i++) xs.push(xh + i * (p.half - xh) / n);
    var P = p.R / (n - 0.5);
    var nodes = [
      node('N1', p.a, yNib, { support: 'ry', bearing: 250 }),
      node('N2', xh, h - c), node('N3', xh, c), node('N4', xs[0], yNib)
    ];
    var T = [], B = [];
    xs.forEach(function (x, k) {
      var last = k === n - 1;
      T.push('N' + (5 + 2 * k)); B.push('N' + (6 + 2 * k));
      nodes.push(node(T[k], x, h - c, { fy: -(last ? P / 2 : P), bearing: last ? 0 : 300, support: last ? 'rx' : null }));
      nodes.push(node(B[k], x, c, { support: last ? 'rx' : null }));
    });
    var mem = [], id = 0;
    function add(i, j, o) { mem.push(bar('M' + (++id), i, j, o)); }
    add('N1', 'N2', { w: 300 });
    add('N1', 'N4', { tie: true, w: 150, anchor: 'plate' });
    add('N2', 'N3', { tie: true, w: 150, anchor: 'stirrup' });
    add('N2', T[0], { w: 150 });
    add('N3', 'N4', { w: 250 });
    add('N3', T[0], { w: 300 });
    add('N3', B[0], { tie: true, w: 150, anchor: 'plate' });
    add(T[0], 'N4', { w: 150, anchor: 'stirrup' });
    add('N4', B[0], { tie: true, w: 150, anchor: 'stirrup' });
    for (var k = 0; k < n - 1; k++) {
      add(T[k], T[k + 1], { w: 150 });
      add(B[k], B[k + 1], { tie: true, w: 150, anchor: 'hook' });
      add(B[k], T[k + 1], { w: 250 });
      add(T[k + 1], B[k + 1], { tie: true, w: 150, anchor: 'stirrup' });
    }
    return {
      errors: errors,
      model: {
        schema: 1, code: 'S6', material: examples.material({ fc: p.fc, b: p.b }),
        outline: [[0, h - hn], [ln, h - hn], [ln, 0], [p.half, 0], [p.half, h], [0, h]].map(function (q) { return [r6(q[0]), r6(q[1])]; }),
        nodes: nodes, members: mem, meta: { template: 'dappedEnd', params: p }
      }
    };
  }

  // ------------------------------------------------------- chevêtre multicolonne
  function bentCap(p) {
    p = Object.assign({}, DEFAULTS.bentCap, p || {});
    var ncol = Math.max(2, Math.min(4, Math.round(p.ncol))), ng = Math.max(1, Math.round(p.nGirders));
    var h = p.h, c = Math.max(0.1, 0.08 * h), errors = [];
    var cols = [], girders = [];
    for (var i = 0; i < ncol; i++) cols.push((i - (ncol - 1) / 2) * p.spacing);
    for (var g = 0; g < ng; g++) girders.push((g - (ng - 1) / 2) * p.girderSpacing);
    var x0 = cols[0] - p.overhang, x1 = cols[ncol - 1] + p.overhang;
    girders.forEach(function (x) { if (x < x0 + 0.2 || x > x1 - 0.2) errors.push('girders'); });
    var xs = cols.concat(girders).sort(function (a, b) { return a - b; });
    xs = xs.filter(function (x, k) { return k === 0 || x - xs[k - 1] > 1e-3; });
    var nodes = [], T = [], B = [];
    xs.forEach(function (x, k) {
      var load = girders.some(function (gx) { return Math.abs(gx - x) < 1e-3; });
      var col = cols.findIndex(function (cx) { return Math.abs(cx - x) < 1e-3; });
      T.push('N' + (2 * k + 1)); B.push('N' + (2 * k + 2));
      nodes.push(node(T[k], x, h - c, { fy: load ? -p.P : 0, bearing: load ? 500 : 0 }));
      nodes.push(node(B[k], x, c, { support: col < 0 ? null : col === 0 ? 'pin' : 'ry', bearing: col < 0 ? 0 : p.colWidth * 1000 }));
    });
    var mem = [], id = 0;
    function add(i, j, o) { mem.push(bar('M' + (++id), i, j, o)); }
    for (var k = 0; k < xs.length; k++) {
      add(T[k], B[k], { tie: true, w: 150, anchor: 'stirrup' });
      if (k === xs.length - 1) break;
      add(T[k], T[k + 1], { tie: true, w: 200, anchor: 'hook' });
      add(B[k], B[k + 1], { tie: true, w: 200, anchor: 'hook' });
      // Diagonal strut falls towards the nearest column.
      var mid = (xs[k] + xs[k + 1]) / 2, near = cols.reduce(function (a, b) { return Math.abs(b - mid) < Math.abs(a - mid) ? b : a; });
      if (near > mid) add(T[k], B[k + 1], { w: 350 }); else add(T[k + 1], B[k], { w: 350 });
    }
    var cw = p.colWidth / 2, stub = Math.min(1.2, h);
    var outline = [[x0, 0]];
    cols.forEach(function (cx) { outline.push([cx - cw, 0], [cx - cw, -stub], [cx + cw, -stub], [cx + cw, 0]); });
    outline.push([x1, 0], [x1, h], [x0, h]);
    return {
      errors: errors,
      model: {
        schema: 1, code: 'S6', material: examples.material({ fc: p.fc, b: p.b }),
        outline: outline.map(function (q) { return [r6(q[0]), r6(q[1])]; }),
        nodes: nodes, members: mem, meta: { template: 'bentCap', params: p }
      }
    };
  }

  // ------------------------------------------------------- semelle sur pieux
  // 2D elevation. 2 piles: as drawn. 4 piles (square, side s): each pile line
  // stands for two piles; the 2D tie is shared by two parallel ties. 3 piles
  // (equilateral triangle, side s): section through pile A and the B–C line;
  // the side ties of the triangle carry T2D / √3.
  function pileCap(p) {
    p = Object.assign({}, DEFAULTS.pileCap, p || {});
    var np = [2, 3, 4].indexOf(Math.round(p.np)) >= 0 ? Math.round(p.np) : 4;
    var h = p.h, c = 0.15, ytop = h - 0.15, errors = [];
    var s = p.s, e = p.edge, d = p.pileD, cw = p.colWidth, stub = 0.6;
    if (!(e >= d / 2 + 0.15)) errors.push('edge');
    if (!(s >= 2.5 * d)) errors.push('s');
    var nodes, mem, xa, xb, b, pileMap, tie3D;
    // Plate lengths over the full width b giving the real bearing areas
    // (square pile of equal area 0.886 d, square column cw × cw).
    var bmm = (np === 3 ? s + 2 * e : np === 4 ? s + 2 * e : 2 * e) * 1000, sq = 0.886 * d * 1000;
    var plate1 = Math.round(sq * sq / bmm), colPlate = Math.round(cw * cw * 1e6 / bmm);
    if (np === 3) {
      var r = s / Math.sqrt(3);
      xa = -r / 2; xb = r;
      b = s + 2 * e;
      nodes = [
        node('N1', 0, ytop, { fy: -p.P, bearing: colPlate }),
        node('N2', xa, c, { support: 'pin', bearing: 2 * plate1 }),
        node('N3', xb, c, { support: 'ry', bearing: plate1 })
      ];
      mem = [bar('M1', 'N2', 'N3', { tie: true, w: 250, anchor: 'hook' }), bar('M2', 'N1', 'N2', { w: 400 }), bar('M3', 'N1', 'N3', { w: 400 })];
      pileMap = { N2: [{ pile: 'P2', share: 0.5 }, { pile: 'P3', share: 0.5 }], N3: [{ pile: 'P1', share: 1 }] };
      tie3D = { factor: 1 / Math.sqrt(3), ties: 3 };

      var dx = p[0] - drag.start[0], dy = p[1] - drag.start[1];
      if (!drag.moved && Math.hypot(dx, dy) < 3) return;
      if (drag.kind === 'pan') {
        drag.moved = true;
        view.ox = drag.view.ox + dx; view.oy = drag.view.oy + dy; render(); return;
      }
      if (!drag.committed) { App.commit(); drag.committed = true; }
      drag.moved = true;
      var s = App.display.snap && !e.altKey ? niceStep(view.k) : 0;
      var snap = function (v) { return s ? App.round(Math.round(v / s) * s) : App.round(v); };
      var dwx = dx / view.k, dwy = -dy / view.k;
      if (drag.kind === 'node') {
        var n = App.node(drag.id);
        n.x = snap(drag.orig[0] + dwx); n.y = snap(drag.orig[1] + dwy);
      } else if (drag.kind === 'member') {
        var m = App.member(drag.id), A = App.node(m.i), B = App.node(m.j);
        var ddx = snap(drag.origA[0] + dwx) - drag.origA[0], ddy = snap(drag.origA[1] + dwy) - drag.origA[1];
        A.x = App.round(drag.origA[0] + ddx); A.y = App.round(drag.origA[1] + ddy);
        B.x = App.round(drag.origB[0] + ddx); B.y = App.round(drag.origB[1] + ddy);
      } else if (drag.kind === 'vertex') {
        App.model.outline[drag.index] = [snap(drag.orig[0] + dwx), snap(drag.orig[1] + dwy)];
      }
      changed({ drag: true });
      return;
    }
    var key = hit ? hit.type + ':' + (hit.id || hit.index) : '';
    var prev = App.hover ? App.hover.type + ':' + (App.hover.id || App.hover.index) : '';
    if (key !== prev) { App.hover = hit && (hit.type === 'node' || hit.type === 'member') ? hit : null; render(); }
    else if (App.tool === 'member' || App.tool === 'node') render();
    else hud();
    showTooltip(hit, p);
  }

  function onUp(e) {
    delete pointers[e.pointerId];
    if (pinch) { if (Object.keys(pointers).length < 2) pinch = null; return; }
    if (!drag) return;
    var d = drag; drag = null;
    if (d.kind === 'pan' && !d.moved && d.clear) { pending = null; select(null); }
    if (d.kind !== 'pan' && d.moved) changed({ inputs: true });
    render();
  }

  function onWheel(e) {
    e.preventDefault();
    var p = localPoint(e), f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016));
    zoomAt(p, f);
  }
  function zoomAt(p, f) {
    var k = Math.max(5, Math.min(view.k * f, 6000));
    f = k / view.k;
    view.ox = p[0] - (p[0] - view.ox) * f; view.oy = p[1] - (p[1] - view.oy) * f; view.k = k;
    render();
  }
  App.zoom = function (f) { zoomAt([W / 2, H / 2], f); };

  var pinch = null;
  function startPinch() {
    var ids = Object.keys(pointers), a = pointers[ids[0]], b = pointers[ids[1]];
    drag = null;
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] };
  }
  function movePinch() {
    var ids = Object.keys(pointers), a = pointers[ids[0]], b = pointers[ids[1]];
    var d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    view.ox += m[0] - pinch.m[0]; view.oy += m[1] - pinch.m[1];
    zoomAt(m, d / pinch.d);
    pinch = { d: d, m: m };
  }

  // ------------------------------------------------------------ tooltip ---
  function hideTooltip() { var t = document.getElementById('tooltip'); if (t) t.classList.add('hidden'); }
  function showTooltip(hit, p) {
    var t = document.getElementById('tooltip');
    if (!t) return;
    if (!hit || (hit.type !== 'node' && hit.type !== 'member') || drag) { t.classList.add('hidden'); return; }
    var html = '';
    if (hit.type === 'member') {
      var m = App.member(hit.id), f = App.force(hit.id), c = App.memberCheck(hit.id);
      if (!m) return;
      var kind = f ? f.kind : 'zero';
      html = '<div class="tt-head"><b>' + m.id + ' · ' + App.t('kind_' + kind) + '</b><span>' + m.i + '–' + m.j + '</span></div>';
      if (f) html += '<div class="tt-row"><span>N</span><span>' + App.fmt(f.N, 1) + ' kN</span></div><div class="tt-row"><span>L</span><span>' + App.fmt(f.L, 3) + ' m</span></div>';
      if (c && c.capacity !== null) html += '<div class="tt-row"><span>' + (kind === 'tie' ? 'Tr' : 'Cr') + '</span><span>' + App.fmt(c.capacity, 0) + ' kN</span></div><div class="tt-row"><span>' + App.t('utilShort') + '</span><span style="color:' + App.utilInk(c.util) + '">' + App.fmt(c.util, 2) + '</span></div>';
    } else {
      var n = App.node(hit.id), nc = App.nodeCheck(hit.id), R = App.reaction(hit.id);
      if (!n) return;
      html = '<div class="tt-head"><b>' + n.id + (nc ? ' · ' + nc.type : '') + '</b><span>(' + App.fmt(n.x, 3) + ' ; ' + App.fmt(n.y, 3) + ')</span></div>';
      if (n.fx || n.fy) html += '<div class="tt-row"><span>F</span><span>' + App.fmt(n.fx, 0) + ' ; ' + App.fmt(n.fy, 0) + ' kN</span></div>';
      if (R) html += '<div class="tt-row"><span>R</span><span>' + App.fmt(R.rx, 0) + ' ; ' + App.fmt(R.ry, 0) + ' kN</span></div>';
      if (nc) html += '<div class="tt-row"><span>' + App.t('utilShort') + '</span><span style="color:' + App.utilInk(nc.util) + '">' + App.fmt(nc.util, 2) + '</span></div>';
    }
    t.innerHTML = html;
    t.classList.remove('hidden');
    var x = p[0] + 16, y = p[1] + 14, tw = t.offsetWidth, th = t.offsetHeight;
    if (x + tw > W - 8) x = p[0] - tw - 12;
    if (y + th > H - 8) y = p[1] - th - 10;
    t.style.left = x + 'px'; t.style.top = y + 'px';
  }

  // --------------------------------------------------------------- public ---
  App.fit = function () {
    if (!App.model) return;
    var ins = document.getElementById('inspector');
    var right = ins && !ins.classList.contains('hidden') && W > 900 ? 340 : 70;
    var v = fitView(App.model, W, H, { l: 90, r: right, t: 95, b: 120 });
    view.ox = v.ox; view.oy = v.oy; view.k = v.k;
    render();
  };
  App.setTool = function (t) {
    App.tool = t; pending = null;
    if (t !== 'outline' && App.sel && App.sel.type === 'vertex') App.sel = null;
    App.listeners.forEach(function (fn) { fn({ tool: true }); });
    render();
  };
  App.nudge = function (dx, dy) {
    if (!App.sel) return;
    var s = niceStep(view.k);
    App.commit();
    if (App.sel.type === 'node') { var n = App.node(App.sel.id); n.x = App.round(n.x + dx * s); n.y = App.round(n.y + dy * s); }
    else if (App.sel.type === 'vertex') { var p = App.model.outline[App.sel.index]; p[0] = App.round(p[0] + dx * s); p[1] = App.round(p[1] + dy * s); }
    else if (App.sel.type === 'member') { var m = App.member(App.sel.id);[App.node(m.i), App.node(m.j)].forEach(function (nn) { nn.x = App.round(nn.x + dx * s); nn.y = App.round(nn.y + dy * s); }); }
    changed({ inputs: true });
  };

  // Light drawing for reports and SVG export.
  App.staticSVG = function (opts) {
    opts = opts || {};
    var model = opts.model || App.model, result = opts.result || App.result, checks = opts.checks || App.checks;
    var w = opts.width || 1000;
    var b = bbox(model), bw = Math.max(b.x1 - b.x0, 0.2), bh = Math.max(b.y1 - b.y0, 0.2);
    var h = opts.height || Math.round(Math.max(340, Math.min(720, (w - 140) * bh / bw + 150)));
    var pad = opts.pad || { l: 90, r: 90, t: 85, b: 110 };
    var v = fitView(model, w, h, pad);
    var body = draw(model, result, checks, { view: v, w: w, h: h, palette: opts.palette || 'light', mode: opts.mode || 'forces', bands: true, ids: opts.ids !== false, zones: opts.zones !== false, grid: opts.grid !== false, interactive: false });
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" font-family="Segoe UI, Inter, Roboto, Arial, sans-serif">' + body + '</svg>';
  };

  App.initCanvas = function () {
    svg = document.getElementById('canvas');
    wrap = document.getElementById('canvas-wrap');
    var first = true;
    var ro = new ResizeObserver(function () {
      var r = wrap.getBoundingClientRect();
      var cx = W ? (W / 2 - view.ox) / view.k : 0, cy = H ? (view.oy - H / 2) / view.k : 0;
      W = Math.max(200, Math.round(r.width)); H = Math.max(200, Math.round(r.height));
      if (first) { first = false; App.fit(); return; }
      view.ox = W / 2 - cx * view.k; view.oy = H / 2 + cy * view.k;
      render();
    });
    ro.observe(wrap);
    svg.addEventListener('pointerdown', onDown);
    svg.addEventListener('pointermove', onMove);
    svg.addEventListener('pointerup', onUp);
    svg.addEventListener('pointercancel', onUp);
    svg.addEventListener('pointerleave', function () { cursor = null; cursorRaw = null; if (App.hover) { App.hover = null; render(); } hideTooltip(); hud(); });
    svg.addEventListener('wheel', onWheel, { passive: false });
    svg.addEventListener('dblclick', function (e) { if (!hitOf(e) && App.tool === 'select') App.fit(); });
    svg.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      if (pending) { pending = null; render(); return; }
      var hit = hitOf(e);
      if (App.tool === 'outline' && hit && hit.type === 'vertex' && App.model.outline.length > 3) {
        App.commit(); App.model.outline.splice(hit.index, 1); App.sel = null; changed({ inputs: true });
      }
    });
    window.addEventListener('keydown', function (e) { if (e.code === 'Space' && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) { spaceDown = true; e.preventDefault(); } });
    window.addEventListener('keyup', function (e) { if (e.code === 'Space') spaceDown = false; });
    App.on(function (o) { if (o.fit) App.fit(); else render(); });
  };
  App.renderCanvas = render;
  App.canvasView = function () { return view; };
})();

</script>
<script>/* js/panels.js */
// SPDX-License-Identifier: GPL-3.0-or-later
/* QuickerStrut&Tie — side panel, inspector, metrics, result tables, toolbar. */
(function () {
  'use strict';
  var QST = window.QST, App = QST.App, t = App.t, fmt = App.fmt, esc = App.esc;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  var ICONS = {
    select: '<path d="M5 3l10 7-4.3 1 2.6 5-2 1-2.6-5L5 15z" fill="currentColor"/>',
    node: '<circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 3.5v4M13 5.5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    member: '<path d="M4.5 15.5L15.5 4.5" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.2"/><circle cx="4.5" cy="15.5" r="2.4" fill="currentColor"/><circle cx="15.5" cy="4.5" r="2.4" fill="currentColor"/>',
    support: '<path d="M10 4l-6 9h12z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3 16h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
    load: '<path d="M10 2.5v11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5.5 10l4.5 5.5 4.5-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
    outline: '<path d="M3.5 5.5l9-2 4 6-3 7.5h-8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><rect x="2" y="4" width="3" height="3" fill="currentColor"/><rect x="11" y="2" width="3" height="3" fill="currentColor"/><rect x="15" y="8" width="3" height="3" fill="currentColor"/>',
    erase: '<path d="M8 16.5h8.5M3.5 12l7-7.5 5.5 5.5-7 7H6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>'
  };
  var TOOLS = [['select', 'V'], ['node', 'N'], ['member', 'B'], ['support', 'S'], ['load', 'L'], ['outline', 'C'], ['erase', 'E']];

  function numInput(value, attrs) {
    return '<input class="num" inputmode="decimal" autocomplete="off" spellcheck="false" value="' + esc(App.fmtInput(value)) + '" ' + attrs + '>';
  }
  function unitField(label, key, value, unit, extra) {
    return '<label class="field"><span>' + label + (extra || '') + '</span><span class="unit-wrap">' + numInput(value, 'data-k="' + key + '"') + '<i>' + unit + '</i></span></label>';
  }

  // ---------------------------------------------------------- toolbox ---
  function renderToolbox() {
    $('#toolbox').innerHTML = TOOLS.map(function (tl) {
      return '<button type="button" class="tool' + (App.tool === tl[0] ? ' active' : '') + '" data-tool="' + tl[0] + '" title="' + esc(t('tool_' + tl[0]) + ' (' + tl[1] + ')') + '" aria-pressed="' + (App.tool === tl[0]) + '"><svg viewBox="0 0 20 20" aria-hidden="true">' + ICONS[tl[0]] + '</svg><span class="tl">' + t('tool_' + tl[0]) + '</span><span class="k">' + tl[1] + '</span></button>';
    }).join('');
    $('#display-mode').innerHTML = ['geometry', 'forces', 'util'].map(function (m) {
      return '<button type="button" data-mode="' + m + '" class="' + (App.display.mode === m ? 'active' : '') + '">' + t('mode_' + m) + '</button>';
    }).join('');
    var chips = { bands: 'chipBands', zones: 'chipZones', ids: 'chipIds', snap: 'chipSnap' };
    Object.keys(chips).forEach(function (k) {
      var el = $('#toggle-' + k);
      el.setAttribute('aria-pressed', String(!!App.display[k]));
      el.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true">' + (App.display[k] ? '<path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' : '<circle cx="8" cy="8" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>') + '</svg><span class="cl">' + t(chips[k]) + '</span>';
      el.title = t(chips[k]);
    });
    $('#undo').disabled = !App.history.length;
    $('#redo').disabled = !App.future.length;
  }

  function renderLegend() {
    var el = $('#legend');
    if (App.display.mode === 'util') {
      el.innerHTML = '<span>0</span><span class="grad"></span><span>≥ 1,0</span>'.replace('1,0', fmt(1, 1));
      return;
    }
    el.innerHTML =
      '<span><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="#7cb4ff" stroke-width="2.4" stroke-dasharray="7 4"/></svg>' + t('legendStrut') + '</span>' +
      '<span><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="#ffc978" stroke-width="3.2"/></svg>' + t('legendTie') + '</span>' +
      '<span><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="#6f8a99" stroke-width="1.4" stroke-dasharray="2 4"/></svg>' + t('legendZero') + '</span>' +
      (App.display.mode === 'forces' ? '<span><svg width="18" height="10"><path d="M1 5h11" stroke="#56e0bb" stroke-width="2"/><path d="M17 5l-6-4v8z" fill="#56e0bb"/></svg>' + t('legendReaction') + '</span>' : '');
  }

  // --------------------------------------------------------- inputs ---
  function renderInputs() {
    var box = $('#input-content'), active = document.activeElement, key = active && box.contains(active) ? active.dataset.k : null;
    var scroll = box.scrollTop;
    $$('.input-tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.panel === App.panel); });
    $('#count-nodes').textContent = App.model.nodes.length;
    $('#count-members').textContent = App.model.members.length;
    if (App.panel === 'params') box.innerHTML = paramsPanel();
    else if (App.panel === 'nodes') box.innerHTML = nodesPanel();
    else box.innerHTML = membersPanel();
    box.scrollTop = scroll;
    if (key) { var el = box.querySelector('[data-k="' + key + '"]'); if (el) { el.focus(); if (el.select) try { el.select(); } catch (e) {} } }
    $('#project-name').value = App.model.name || '';
    $('#dirty').textContent = App.dirty ? '● ' + t('unsaved') : '';
  }

  function paramsPanel() {
    var m = App.model, mat = m.material, code = QST.csa.CODES[m.code], F = QST.csa.factors(m);
    var h = '';
    h += '<div class="section-label">' + t('designCode') + '</div>';
    h += '<div class="segmented full" role="group">' + ['S6', 'A23'].map(function (c) {
      return '<button type="button" class="code-card' + (m.code === c ? ' active' : '') + '" data-code="' + c + '"><b>' + QST.csa.CODES[c].name + '</b><small>' + t('code_' + c) + '</small></button>';
    }).join('') + '</div>';
    h += '<div class="section-label">' + t('materials') + '</div>';
    h += '<div class="field-row">' + unitField("f'c", 'mat.fc', mat.fc, 'MPa') + unitField('fy', 'mat.fy', mat.fy, 'MPa') + '</div>';
    h += '<div class="field-row">' + unitField('Es', 'mat.Es', mat.Es, 'MPa') + unitField(t('thickness') + ' b', 'mat.b', mat.b, 'mm') + '</div>';
    h += '<div class="field-row">' +
      '<label class="field"><span>φc <em>' + t('auto') + ' ' + fmt(code.phiC, 2) + '</em></span>' + numInput(mat.phiC || '', 'data-k="mat.phiC" placeholder="' + fmt(code.phiC, 2) + '"') + '</label>' +
      '<label class="field"><span>φs <em>' + t('auto') + ' ' + fmt(code.phiS, 2) + '</em></span>' + numInput(mat.phiS || '', 'data-k="mat.phiS" placeholder="' + fmt(code.phiS, 2) + '"') + '</label></div>';
    h += '<label class="field"><span>' + t('epsMode') + '</span><select data-k="mat.epsMode"><option value="computed"' + (mat.epsMode !== 'yield' ? ' selected' : '') + '>' + t('epsComputed') + '</option><option value="yield"' + (mat.epsMode === 'yield' ? ' selected' : '') + '>' + t('epsYield') + '</option></select></label>';
    h += '<label class="toggle-row"><input type="checkbox" data-k="mat.tieFaces"' + (mat.tieFaces !== false ? ' checked' : '') + '>' + t('tieFaces') + '</label>';
    h += '<div class="note">' + (m.code === 'S6' ? t('alphaNote').replace('{a}', fmt(QST.csa.alpha1(mat.fc), 3)) + ' ' : '') + t('factorsNote').replace('{phiC}', fmt(F.phiC, 2)).replace('{phiS}', fmt(F.phiS, 2)).replace('{Ec}', fmt(QST.solver.concreteModulus(m.code, mat.fc), 0)) + '</div>';
    h += '<div class="section-label">' + t('crackControl') + '<span style="font-weight:500;letter-spacing:0;text-transform:none">' + t('clause') + ' ' + code.clause.crack + '</span></div>';
    h += '<div class="field-row three">' +
      '<label class="field"><span>ρh</span>' + numInput(mat.rhoH, 'data-k="mat.rhoH"') + '</label>' +
      '<label class="field"><span>ρv</span>' + numInput(mat.rhoV, 'data-k="mat.rhoV"') + '</label>' +
      '<label class="field"><span>s (mm)</span>' + numInput(mat.spacing, 'data-k="mat.spacing"') + '</label></div>';
    h += '<p class="note">' + t('crackNote').replace('{rho}', fmt(code.rhoMin, 3)).replace('{s}', fmt(code.sMax, 0)) + (code.maxFaceArea ? ' ' + t('crackCapNote').replace('{a}', fmt(code.maxFaceArea, 0)) : '') + '</p>';
    h += '<div class="section-label">' + t('outline') + '<span style="font-weight:500;letter-spacing:0;text-transform:none">' + m.outline.length + ' ' + t('vertices') + '</span></div>';
    var b = bounds(m.outline);
    h += '<div class="field-row">' + unitField(t('width'), 'rect.w', App.round(b.x1 - b.x0), 'm') + unitField(t('height'), 'rect.h', App.round(b.y1 - b.y0), 'm') + '</div>';
    h += '<button type="button" class="add-button" id="apply-rect">' + t('applyRect') + '</button>';
    h += '<p class="note">' + t('outlineNote') + '</p>';
    h += '<div class="section-label">' + t('anchorage') + '<span style="font-weight:500;letter-spacing:0;text-transform:none">' + t('clause') + ' ' + code.clause.anchor.split(' · ')[0] + '</span></div>';
    h += '<div class="field-row">' + unitField(t('cover'), 'mat.cover', mat.cover, 'mm') +
      '<label class="field"><span>' + t('ldFactor') + '</span><select data-k="mat.ldFactor"><option value="0.45"' + (Number(mat.ldFactor) !== 0.6 ? ' selected' : '') + '>0,45 · ' + t('ldFav') + '</option><option value="0.6"' + (Number(mat.ldFactor) === 0.6 ? ' selected' : '') + '>0,6 · ' + t('ldOther') + '</option></select></label></div>';
    h += '<p class="note">' + t('anchorNote') + '</p>';
    h += '<div class="section-label">' + t('autoSizeTitle') + '</div>';
    h += '<button type="button" class="add-button" id="auto-size">⚙ ' + t('autoSize') + '</button><p class="note">' + t('autoSizeNote') + '</p>';
    return h;
  }
  function bounds(pts) {
    var xs = pts.map(function (p) { return p[0]; }), ys = pts.map(function (p) { return p[1]; });
    return { x0: Math.min.apply(null, xs), x1: Math.max.apply(null, xs), y0: Math.min.apply(null, ys), y1: Math.max.apply(null, ys) };
  }

  function supportOptions(v) {
    return [['', t('sup_none')], ['pin', t('sup_pin')], ['ry', t('sup_ry')], ['rx', t('sup_rx')]].map(function (o) {
      return '<option value="' + o[0] + '"' + ((v || '') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('');
  }
  function nodesPanel() {
    var h = '<div class="rows">';
    if (!App.model.nodes.length) h += '<p class="note">' + t('noNodes') + '</p>';
    App.model.nodes.forEach(function (n) {
      var sel = App.sel && App.sel.type === 'node' && App.sel.id === n.id;
      h += '<div class="row-card' + (sel ? ' selected' : '') + '" data-row-node="' + n.id + '">' +
        '<div class="row-line row-node-1"><span class="tag" data-pick-node="' + n.id + '">' + n.id + '</span>' +
        '<label><span class="mini">x (m)</span>' + numInput(n.x, 'data-k="n.' + n.id + '.x"') + '</label>' +

  // Apply one edited field (data-k) to the model.
  function applyField(el) {
    var k = el.dataset.k; if (!k) return;
    var parts = k.split('.'), m = App.model;
    var isNum = el.classList.contains('num');
    var val = el.type === 'checkbox' ? el.checked : isNum ? App.parse(el.value) : el.value;
    if (isNum && (val === null && !/phi/.test(k))) { el.classList.add('num-err'); return; }
    if (isNum && Number.isNaN(val)) { el.classList.add('num-err'); return; }
    el.classList.remove('num-err');
    App.commit();
    if (parts[0] === 'mat') {
      var key = parts[1];
      if (key === 'epsMode') m.material.epsMode = val;
      else if (key === 'ldFactor') m.material.ldFactor = Number(val);
      else if (key === 'tieFaces') m.material.tieFaces = !!val;
      else m.material[key] = val === null ? 0 : Math.max(0, val);
    } else if (parts[0] === 'n') {
      var n = App.node(parts[1]); if (!n) return;
      if (parts[2] === 'support') n.support = val || null;
      else if (parts[2] === 'bearing') n.bearing = Math.max(0, val);
      else n[parts[2]] = val;
    } else if (parts[0] === 'm') {
      var b = App.member(parts[1]); if (!b) return;
      var f = parts[2];
      if (f === 'i' || f === 'j') {
        var other = f === 'i' ? b.j : b.i;
        if (val === other) { App.history.pop(); App.toast(t('memberSelf')); renderInputs(); return; }
        b[f] = val;
      } else if (f === 'role') b.role = val;
      else if (f === 'w') b.w = Math.max(0, val);
      else if (f === 'barsN') { var nb = Math.max(0, Math.round(val)); b.bars = nb > 0 ? { n: nb, size: b.bars ? b.bars.size : '20M' } : null; if (!nb) b.As = 0; }
      else if (f === 'barsSize') { b.bars = { n: b.bars && b.bars.n > 0 ? b.bars.n : 2, size: val }; }
      else if (f === 'As') { b.bars = null; b.As = Math.max(0, val); }
      else if (f === 'anchor') b.anchor = val;
      App.lastMemberProto = { role: 'auto', w: b.w, bars: b.bars, As: b.As };
    } else if (parts[0] === 'rect') {
      App.history.pop();
      return; // applied with the button
    }
    App.update({ inputs: true });
  }

    var h = '';
    if (s.type === 'node') h = nodeInspector(App.node(s.id));
    else if (s.type === 'member') h = memberInspector(App.member(s.id));

    if (!h) { el.classList.add('hidden'); return; }
    var wasHidden = el.classList.contains('hidden');
    el.innerHTML = h;
    el.classList.remove('hidden');
    if (wasHidden) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }
    var fk = (opts && opts.focus) ? 'n.' + s.id + '.' + opts.focus : focusKey;

  // ---------------------------------------------------------- metrics ---
  function renderMetrics() {
    var el = $('#metrics'), r = App.result, c = App.checks;
    if (!r || !r.ok) {
      el.innerHTML = metric(t('mUtil'), '—', '', '', null) + metric(t('mStrut'), '—', 'kN', '', null) + metric(t('mTie'), '—', 'kN', '', null) +
        metric(t('mModel'), '<span style="color:var(--bad)">' + (r && r.error === 'mechanism' ? t('mechanism') : r && r.error === 'empty' ? t('emptyModel') : t('invalidModel')) + '</span>', '', App.model.nodes.length + ' ' + t('nodesLc') + ' · ' + App.model.members.length + ' ' + t('membersLc'), null);
      return;
    }
    var gov = c.governing, maxS = null, maxT = null;
    r.forces.forEach(function (f) { if (f.kind === 'strut' && (!maxS || -f.N > -maxS.N)) maxS = f; if (f.kind === 'tie' && (!maxT || f.N > maxT.N)) maxT = f; });
    var r0 = r.indeterminacy;
    var stat = r0 === 0 ? t('determinate') : r0 > 0 ? t('indeterminate') + ' (r = ' + r0 + ')' : t('mechanism');
    el.innerHTML =
      metric(t('mUtil'), gov ? '<span style="color:' + App.utilInk(c.maxUtil) + '">' + fmt(c.maxUtil, 2) + '</span>' : '—', '', gov ? (gov.kind === 'node' ? t('node') + ' ' + gov.id + ' · ' + gov.type : gov.kind === 'anchor' ? t('anchorage') + ' ' + gov.member + ' · ' + gov.node : t('kind_' + gov.kind) + ' ' + gov.id) + ' · ' + statusText(c.maxUtil) : '', gov ? (gov.kind === 'node' ? 'node:' + gov.id : gov.kind === 'anchor' ? 'member:' + gov.member : 'member:' + gov.id) : null) +
      metric(t('mStrut'), maxS ? '<span style="color:var(--blue)">' + fmt(-maxS.N, 0) + '</span>' : '—', 'kN', maxS ? maxS.id : t('none'), maxS ? 'member:' + maxS.id : null) +
      metric(t('mTie'), maxT ? '<span style="color:var(--amber)">' + fmt(maxT.N, 0) + '</span>' : '—', 'kN', maxT ? maxT.id : t('none'), maxT ? 'member:' + maxT.id : null) +
      metric(t('mModel'), '<span style="font-size:1.1rem">' + stat + '</span>', '', App.model.nodes.length + ' ' + t('nodesLc') + ' · ' + App.model.members.length + ' ' + t('membersLc') + ' · ΣF ' + fmt(r.globalResidual, 3) + ' kN · ' + fmt(App.computeMs, 1) + ' ms', null);
  }
