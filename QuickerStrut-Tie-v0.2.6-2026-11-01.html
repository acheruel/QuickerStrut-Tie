  function renderBanner() {
    var el = $('#banner'), r = App.result, msg = null, cls = 'bad';
    if (r && !r.ok && r.error === 'mechanism') msg = '<span>⚠</span><span><b>' + t('mechanism') + '</b> — ' + t('mechanismMsg').replace('{node}', r.mechanismNode).replace('{dir}', r.mechanismDir) + '</span>';
    else if (r && !r.ok && r.error && r.error !== 'empty') msg = '<span>⚠</span><span><b>' + t('invalidModel') + '</b> — ' + t('err_' + r.error) + (r.member ? ' (' + r.member + ')' : '') + '</span>';
    else if (r && r.ok && !r.converged) { msg = '<span>!</span><span>' + t('notConverged') + '</span>'; cls = 'warn'; }
    else if (App.warnings.length) {
      cls = 'warn';
      msg = '<span>!</span><span>' + t('outsideMsg') + ' ' + App.warnings.map(function (w) { return w.id; }).join(', ') + '</span>';
    }
    if (!msg) { el.classList.add('hidden'); return; }
    el.className = 'banner ' + cls; el.innerHTML = msg;
  }
  function renderEmpty() {
    var el = $('#empty-hint');
    if (App.model.nodes.length) { el.classList.add('hidden'); return; }
    el.innerHTML = '<div>' + t('emptyHint') + '</div>';
    el.classList.remove('hidden');
  }

  // ---------------------------------------------------------- results ---
  function cellU(u) {
    var w = Math.min(100, (isFinite(u) ? u : 1.2) * 100 / 1.2);
    return '<span class="cell-ubar"><i style="width:' + w + '%;background:' + App.utilColor(u) + '"></i></span><b style="color:' + App.utilInk(u) + '">' + fmt(u, 2) + '</b>';
  }
  function isSel(type, id) { return App.sel && App.sel.type === type && App.sel.id === id ? ' class="selected"' : ''; }
  function renderResults() {
    var el = $('#result-view'), r = App.result, c = App.checks;
    $$('#view-tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.view === App.view); });
    if (!r || !r.ok) { el.innerHTML = '<p class="table-note">' + t('noResults') + '</p>'; return; }
    var code = QST.csa.CODES[App.model.code], h = '';
    if (App.view === 'checks') {
      h += '<div class="table-scroll"><table><thead><tr><th>' + t('element') + '</th><th class="l">' + t('type') + '</th><th>' + t('demand') + '</th><th>' + t('resistance') + '</th><th>' + t('details') + '</th><th class="l">' + t('utilShort') + '</th><th class="l">' + t('clause') + '</th></tr></thead><tbody>';
      var struts = c.members.filter(function (e) { return e.kind === 'strut'; }), ties = c.members.filter(function (e) { return e.kind === 'tie'; });
      if (struts.length) h += '<tr class="group"><td colspan="7">' + t('struts') + ' · Cr = φc fcu w b</td></tr>';
      struts.forEach(function (e) {
        h += '<tr data-target="member:' + e.id + '"' + isSel('member', e.id) + '><td>' + e.id + '</td><td class="l">' + t('kind_strut') + '</td><td>' + fmt(e.demand, 0) + ' kN</td><td>' + fmt(e.capacity, 0) + ' kN</td><td>fcu ' + fmt(e.fcu, 2) + ' MPa' + (e.theta !== null ? ' · θs ' + fmt(deg(e.theta), 1) + '°' : '') + ' · w ' + fmt(e.w, 0) + '</td><td class="l">' + cellU(e.util) + '</td><td class="l">' + code.clause.strut + '</td></tr>';
      });
      if (ties.length) h += '<tr class="group"><td colspan="7">' + t('ties') + ' · Tr = φs fy As</td></tr>';
      ties.forEach(function (e) {
        h += '<tr data-target="member:' + e.id + '"' + isSel('member', e.id) + '><td>' + e.id + '</td><td class="l">' + t('kind_tie') + '</td><td>' + fmt(e.demand, 0) + ' kN</td><td>' + fmt(e.capacity, 0) + ' kN</td><td>As ' + fmt(e.As, 0) + ' / ' + fmt(e.asReq, 0) + ' mm² · εs ' + fmt(e.epsS * 1000, 2) + '‰</td><td class="l">' + cellU(e.util) + '</td><td class="l">' + code.clause.tie + '</td></tr>';
      });
      if (c.nodes.length) h += '<tr class="group"><td colspan="7">' + t('nodalZones') + '</td></tr>';
      c.nodes.forEach(function (e) {
        var g = e.governingFace;
        h += '<tr data-target="node:' + e.id + '"' + isSel('node', e.id) + '><td>' + e.id + '</td><td class="l">' + e.type + '</td><td>' + (g ? fmt(g.stress, 2) + ' MPa' : '—') + '</td><td>' + fmt(e.limit, 2) + ' MPa</td><td>' + (g ? t('face_' + g.kind) + (g.kind === 'strut' || g.kind === 'tie' ? ' ' + g.ref : '') + ' · w ' + fmt(g.width, 0) : '') + '</td><td class="l">' + cellU(e.util) + '</td><td class="l">' + code.clause.node + '</td></tr>';
      });
      if (c.anchors.length) h += '<tr class="group"><td colspan="7">' + t('anchorages') + ' · l<sub>a</sub> ≥ l<sub>d</sub></td></tr>';
      c.anchors.forEach(function (a) {
        h += '<tr data-target="member:' + a.member + '"' + isSel('member', a.member) + '><td>' + a.member + ' · ' + a.node + '</td><td class="l">' + t('anchor_' + a.type) + '</td><td>' + (a.mechanical || a.na ? '—' : fmt(a.req, 0) + ' mm') + '</td><td>' + fmt(a.la, 0) + ' mm</td><td>' + (a.na ? t('dbUnknown') : a.mechanical ? t(a.type === 'continuous' ? 'continuousNote' : 'mechanicalNote') : 'd<sub>b</sub> ' + fmt(a.db, 1) + (a.top ? ' · k1 1,3' : '')) + '</td><td class="l">' + (a.mechanical || a.na ? '<span class="status ' + (a.na ? 'na' : 'ok') + '">' + (a.na ? '?' : '✓') + '</span>' : cellU(a.util)) + '</td><td class="l">' + a.clause.split(' · ')[0] + '</td></tr>';
      });
      var ck = c.crack;
      h += '<tr class="group"><td colspan="7">' + t('crackControl') + '</td></tr>';
      h += '<tr><td>ρh · ρv</td><td class="l">' + t('grid') + '</td><td>' + fmt(ck.rhoH, 4) + ' · ' + fmt(ck.rhoV, 4) + '</td><td>≥ ' + fmt(ck.rhoMin, 4) + '</td><td>s = ' + fmt(ck.spacing, 0) + ' ≤ ' + fmt(ck.sMax, 0) + ' mm</td><td class="l">' + cellU(ck.util) + '</td><td class="l">' + ck.clause + '</td></tr>';
      h += '</tbody></table></div><p class="table-note">' + t('checksNote').replace('{code}', code.name).replace('{phiC}', fmt(c.phiC, 2)).replace('{phiS}', fmt(c.phiS, 2)) + '</p>';
    } else if (App.view === 'forces') {
      h += '<div class="table-scroll"><table><thead><tr><th>' + t('member') + '</th><th class="l">' + t('nodesCol') + '</th><th>L (m)</th><th>' + t('angle') + ' (°)</th><th>N (kN)</th><th class="l">' + t('type') + '</th><th>w (mm)</th><th>As (mm²)</th></tr></thead><tbody>';
      r.forces.forEach(function (f) {
        var m = App.member(f.id);
        h += '<tr data-target="member:' + f.id + '"' + isSel('member', f.id) + '><td>' + f.id + '</td><td class="l">' + m.i + ' – ' + m.j + '</td><td>' + fmt(f.L, 3) + '</td><td>' + fmt(deg(Math.atan2(f.s, f.c)), 1) + '</td><td><b style="color:' + (f.kind === 'tie' ? 'var(--amber)' : f.kind === 'strut' ? 'var(--blue)' : 'var(--muted)') + '">' + fmt(f.N, 1) + '</b></td><td class="l">' + t('kind_' + f.kind) + '</td><td>' + fmt(m.w, 0) + '</td><td>' + fmt(QST.csa.memberArea(m), 0) + '</td></tr>';
      });
      h += '</tbody></table></div><p class="table-note">' + t('forcesNote') + '</p>';
    } else {
      h += '<div class="table-scroll"><table><thead><tr><th>' + t('node') + '</th><th class="l">' + t('support') + '</th><th>Rx (kN)</th><th>Ry (kN)</th><th>|R| (kN)</th></tr></thead><tbody>';
      r.reactions.forEach(function (R) {
        var n = App.node(R.node);
        h += '<tr data-target="node:' + R.node + '"' + isSel('node', R.node) + '><td>' + R.node + '</td><td class="l">' + t('sup_' + n.support) + '</td><td>' + fmt(R.rx, 1) + '</td><td>' + fmt(R.ry, 1) + '</td><td>' + fmt(Math.hypot(R.rx, R.ry), 1) + '</td></tr>';
      });
      var sx = 0, sy = 0; r.reactions.forEach(function (R) { sx += R.rx; sy += R.ry; });
      h += '<tr class="group"><td colspan="5">' + t('equilibrium') + '</td></tr>';
      h += '<tr><td>Σ ' + t('loads') + '</td><td></td><td>' + fmt(r.sumLoads.fx, 1) + '</td><td>' + fmt(r.sumLoads.fy, 1) + '</td><td></td></tr>';
      h += '<tr><td>Σ ' + t('reactions') + '</td><td></td><td>' + fmt(sx, 1) + '</td><td>' + fmt(sy, 1) + '</td><td></td></tr>';
      h += '<tr><td>' + t('residual') + '</td><td></td><td colspan="3">' + r.globalResidual.toExponential(1) + ' kN</td></tr>';
      h += '</tbody></table></div>';
      var pl = QST.templates.pileLoads(App.model, r, window.QST_META);
      if (pl && pl.piles.length && App.model.meta && App.model.meta.pileMap) {
        h += '<div class="table-scroll" style="margin-top:12px"><table><thead><tr><th>' + t('pile') + '</th><th class="l">' + t('node') + '</th><th>x (m)</th><th>N (kN)</th><th>H (kN)</th><th>M (kN·m)</th></tr></thead><tbody>';
        pl.piles.forEach(function (q) { h += '<tr data-target="node:' + q.node + '"><td>' + q.id + '</td><td class="l">' + q.node + '</td><td>' + fmt(q.x, 3) + '</td><td>' + fmt(q.N, 1) + '</td><td>' + fmt(q.H, 1) + '</td><td>0</td></tr>'; });
        h += '</tbody></table></div><p class="table-note">' + t('pileNote') + (App.model.meta && App.model.meta.tie3D && App.model.meta.tie3D.factor !== 1 ? ' ' + t('tie3D').replace('{f}', App.model.meta.tie3D.factor === 0.5 ? (App.lang === 'fr' ? '0,5 (deux tirants parallèles)' : '0.5 (two parallel ties)') : '1/√3') : '') + '</p>';
        h += '<button type="button" class="add-button" id="export-pile" style="max-width:340px">↗ ' + t('exportPile') + '</button>';
      }
    }
    el.innerHTML = h;
  }

  // ------------------------------------------------------- examples ---
  function renderExamples() {
    $('#examples-list').innerHTML = QST.examples.EXAMPLES.map(function (ex) {
      return '<button type="button" role="menuitem" data-example="' + ex.key + '"><svg class="ex-thumb" viewBox="0 0 58 34" aria-hidden="true">' + thumb(ex.model) + '</svg><span class="mi-text"><b>' + ex.title[App.lang] + '</b><small>' + ex.sub[App.lang] + '</small></span></button>';
    }).join('');
  }
  function thumb(m) {
    var xs = m.outline.map(function (p) { return p[0]; }).concat(m.nodes.map(function (n) { return n.x; }));
    var ys = m.outline.map(function (p) { return p[1]; }).concat(m.nodes.map(function (n) { return n.y; }));
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var k = Math.min(50 / (x1 - x0), 26 / (y1 - y0)), ox = 29 - (x0 + x1) / 2 * k, oy = 17 + (y0 + y1) / 2 * k;
    var P = function (x, y) { return (ox + x * k).toFixed(1) + ',' + (oy - y * k).toFixed(1); };
    var s = '<polygon points="' + m.outline.map(function (p) { return P(p[0], p[1]); }).join(' ') + '" fill="#9fc3d2" fill-opacity=".15" stroke="#88b3c6" stroke-width=".7"/>';
    var nm = {}; m.nodes.forEach(function (n) { nm[n.id] = n; });
    m.members.forEach(function (b) {
      var A = nm[b.i], B = nm[b.j], tie = !!b.bars || b.As > 0;
      s += '<polyline points="' + P(A.x, A.y) + ' ' + P(B.x, B.y) + '" stroke="' + (tie ? '#ffc978' : '#7cb4ff') + '" stroke-width="' + (tie ? 1.4 : 1) + '"' + (tie ? '' : ' stroke-dasharray="2 1.3"') + '/>';
    });
    return s;
  }

  // ---------------------------------------------------------- binding ---
  function bind() {
    $('#toolbox').addEventListener('click', function (e) { var b = e.target.closest('[data-tool]'); if (b) App.setTool(b.dataset.tool); });
    $('#display-mode').addEventListener('click', function (e) { var b = e.target.closest('[data-mode]'); if (!b) return; App.display.mode = b.dataset.mode; App.saveUi(); renderToolbox(); renderLegend(); App.renderCanvas(); });
    ['bands', 'zones', 'ids', 'snap'].forEach(function (k) { $('#toggle-' + k).addEventListener('click', function () { App.display[k] = !App.display[k]; App.saveUi(); renderToolbox(); App.renderCanvas(); }); });
    $('#undo').addEventListener('click', App.undo);
    $('#redo').addEventListener('click', App.redo);
    $('#fit').addEventListener('click', App.fit);
    $$('.input-tabs button').forEach(function (b) { b.addEventListener('click', function () { App.panel = b.dataset.panel; App.saveUi(); renderInputs(); }); });
    $('#view-tabs').addEventListener('click', function (e) { var b = e.target.closest('[data-view]'); if (!b) return; App.view = b.dataset.view; App.saveUi(); renderResults(); });

    var box = $('#input-content'), ins = $('#inspector');
    [box, ins].forEach(function (root) {
      root.addEventListener('change', function (e) {
        var el = e.target; if (!el.dataset.k) return;
        // Deferred so that Tab moves the focus first; the re-render restores it.
        setTimeout(function () { if (el.dataset.k.indexOf('v.') === 0) applyVertex(el); else applyField(el); }, 0);
      });
      root.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && e.target.classList.contains('num')) { e.preventDefault(); e.target.blur(); }
        if (e.key === 'Escape' && root === ins) { App.sel = null; App.emitSelection(); }
      });
      root.addEventListener('input', function (e) { if (e.target.classList.contains('num')) { var v = App.parse(e.target.value); e.target.classList.toggle('num-err', Number.isNaN(v)); } });
    });
    box.addEventListener('click', function (e) {
      var b;
      if ((b = e.target.closest('[data-code]'))) { App.commit(); App.model.code = b.dataset.code; App.update({ inputs: true }); return; }
      if ((b = e.target.closest('#auto-size'))) {
        App.commit();
        var info = QST.templates.autoSize(App.model);
        App.update({ inputs: true });
        App.toast(info.error ? t('autoSizeFail') : t('autoSizeDone'));
        return;
      }
      if ((b = e.target.closest('#apply-rect'))) {
        var w = App.parse($('[data-k="rect.w"]').value), hgt = App.parse($('[data-k="rect.h"]').value);
        if (!(w > 0 && hgt > 0)) return;
        var bb = bounds(App.model.outline);
        App.commit(); App.model.outline = [[bb.x0, bb.y0], [bb.x0 + w, bb.y0], [bb.x0 + w, bb.y0 + hgt], [bb.x0, bb.y0 + hgt]];
        App.update({ inputs: true }); return;
      }
      if ((b = e.target.closest('#add-node'))) {
        var bb2 = bounds(App.model.outline);
        App.commit(); var id = App.addNode((bb2.x0 + bb2.x1) / 2, (bb2.y0 + bb2.y1) / 2); App.sel = { type: 'node', id: id };
        App.update({ inputs: true }); return;
      }
      if ((b = e.target.closest('[data-del-node]'))) { App.commit(); App.deleteNode(b.dataset.delNode); App.validateSel(); App.update({ inputs: true }); return; }
      if ((b = e.target.closest('[data-del-member]'))) { App.commit(); App.deleteMember(b.dataset.delMember); App.validateSel(); App.update({ inputs: true }); return; }
      if ((b = e.target.closest('[data-pick-node]'))) { App.sel = { type: 'node', id: b.dataset.pickNode }; App.emitSelection(); return; }
      if ((b = e.target.closest('[data-pick-member]'))) { App.sel = { type: 'member', id: b.dataset.pickMember }; App.emitSelection(); }
    });
    box.addEventListener('focusin', function (e) {
      var row = e.target.closest('[data-row-node],[data-row-member]');
      if (!row) return;
      var s = row.dataset.rowNode ? { type: 'node', id: row.dataset.rowNode } : { type: 'member', id: row.dataset.rowMember };
      if (!App.sel || App.sel.type !== s.type || App.sel.id !== s.id) { App.sel = s; App.renderCanvas(); renderInspector(); $$('.row-card').forEach(function (r) { r.classList.toggle('selected', r === row); }); }
    });
    ins.addEventListener('click', function (e) {
      if (e.target.closest('[data-ins-close]')) { App.sel = null; App.emitSelection(); return; }
      var b = e.target.closest('[data-del-vertex]');
      if (b && App.model.outline.length > 3) { App.commit(); App.model.outline.splice(+b.dataset.delVertex, 1); App.sel = null; App.update({ inputs: true }); }
    });
    ins.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    ins.addEventListener('wheel', function (e) { e.stopPropagation(); }, { passive: true });
    $('#metrics').addEventListener('click', function (e) { var b = e.target.closest('[data-target]'); if (b) pick(b.dataset.target); });
    $('#result-view').addEventListener('click', function (e) {
      if (e.target.closest('#export-pile')) { App.exportPileLoads(); return; }
      var b = e.target.closest('[data-target]'); if (b) pick(b.dataset.target);
    });
    $('#project-name').addEventListener('change', function (e) { App.commit(); App.model.name = e.target.value.trim(); App.update({ inputs: true }); });
  }
  function applyVertex(el) {
    var parts = el.dataset.k.split('.'), v = App.parse(el.value);
    if (!isFinite(v) || v === null) { el.classList.add('num-err'); return; }
    App.commit(); App.model.outline[+parts[1]][+parts[2]] = v; App.update({ inputs: true });
  }
  function pick(target) {
    var p = target.split(':');
    App.sel = { type: p[0], id: p[1] };
    App.emitSelection();
  }

  App.initPanels = function () {
    bind();
    App.on(function (o) {
      if (o.tool) { renderToolbox(); return; }
      if (o.selection) {
        renderInspector(); renderResults();
        if (App.panel !== 'params') $$('.row-card').forEach(function (r) { var id = r.dataset.rowNode || r.dataset.rowMember; r.classList.toggle('selected', !!App.sel && App.sel.id === id); });
        App.renderCanvas();
        return;
      }
      renderToolbox(); renderLegend(); renderMetrics(); renderBanner(); renderEmpty();
      renderResults();
      if (!o.drag || App.panel !== 'params') { if (!o.drag) renderInputs(); }
      renderInspector(o);
    });
  };
  App.renderAllText = function () { renderToolbox(); renderLegend(); renderExamples(); renderInputs(); renderMetrics(); renderBanner(); renderEmpty(); renderResults(); renderInspector(); };
})();

</script>
<script>/* js/report.js */
// SPDX-License-Identifier: GPL-3.0-or-later
/* QuickerStrut&Tie — printable calculation report (browser print → PDF) and CSV export. */
(function () {
  'use strict';
  var QST = window.QST, App = QST.App;

  function deg(r) { return r * 180 / Math.PI; }

  App.buildReport = function () {
    var t = App.t, fmt = App.fmt, esc = App.esc, m = App.model, r = App.result, c = App.checks;
    var code = QST.csa.CODES[m.code], mat = m.material, meta = window.QST_META || {};
    var today = new Date().toLocaleDateString(App.locale(), { year: 'numeric', month: 'long', day: 'numeric' });
    var ok = function (u) { return App.statusOf(u) === 'bad' ? '<span class="rp-bad">' + fmt(u, 2) + ' ✕</span>' : '<span class="rp-ok">' + fmt(u, 2) + ' ✓</span>'; };
    var h = '';
    h += '<div class="rp-head"><div><div class="rp-brand">Quicker<span>Strut&amp;Tie</span></div><h1>' + esc(m.name || t('untitled')) + '</h1><div>' + t('reportTitle') + ' · ' + code.name + '</div></div>' +
      '<div class="rp-meta">' + today + '<br>v' + (meta.version || '') + ' · ' + (meta.date || '') + '<br>' + t('reportSigned') + '</div></div>';

    h += '<h2>1. ' + t('rpInputs') + '</h2><div class="rp-grid">' +
      '<div>' + t('designCode') + ' : <b>' + code.name + '</b> (' + t('code_' + m.code) + ')</div>' +
      '<div>φc = ' + fmt(c.phiC || QST.csa.factors(m).phiC, 2) + ' · φs = ' + fmt(c.phiS || QST.csa.factors(m).phiS, 2) + '</div>' +
      "<div>f′c = " + fmt(mat.fc, 1) + ' MPa · fy = ' + fmt(mat.fy, 0) + ' MPa · Es = ' + fmt(mat.Es, 0) + ' MPa</div>' +
      '<div>' + t('thickness') + ' b = ' + fmt(mat.b, 0) + ' mm · Ec = ' + fmt(QST.solver.concreteModulus(m.code, mat.fc), 0) + ' MPa</div>' +
      '<div>εs : ' + (mat.epsMode === 'yield' ? t('epsYield') : t('epsComputed')) + '</div>' +
      '<div>' + t('crackControl') + ' : ρh = ' + fmt(mat.rhoH, 4) + ' · ρv = ' + fmt(mat.rhoV, 4) + ' · s = ' + fmt(mat.spacing, 0) + ' mm</div></div>';

    h += '<h2>2. ' + t('rpModel') + '</h2><div class="rp-figure">' + App.staticSVG({ mode: 'forces', width: 1000 }) + '</div>';

    h += '<table><thead><tr><th>' + t('node') + '</th><th>x (m)</th><th>y (m)</th><th>' + t('support') + '</th><th>Fx (kN)</th><th>Fy (kN)</th><th>' + t('bearingShort') + ' (mm)</th></tr></thead><tbody>';
    m.nodes.forEach(function (n) { h += '<tr><td>' + n.id + '</td><td>' + fmt(n.x, 3) + '</td><td>' + fmt(n.y, 3) + '</td><td>' + t('sup_' + n.support) + '</td><td>' + fmt(n.fx, 1) + '</td><td>' + fmt(n.fy, 1) + '</td><td>' + fmt(n.bearing, 0) + '</td></tr>'; });
    h += '</tbody></table>';

    if (!r || !r.ok) {
      h += '<h2>3. ' + t('rpResults') + '</h2><p class="rp-bad">' + (r && r.error === 'mechanism' ? t('mechanism') + ' — ' + t('mechanismMsg').replace('{node}', r.mechanismNode).replace('{dir}', r.mechanismDir) : t('noResults')) + '</p>';
    } else {
      h += '<h2>3. ' + t('rpForces') + '</h2><table><thead><tr><th>' + t('member') + '</th><th>' + t('nodesCol') + '</th><th>L (m)</th><th>' + t('angle') + ' (°)</th><th>N (kN)</th><th>' + t('type') + '</th><th>w (mm)</th><th>As (mm²)</th></tr></thead><tbody>';
      r.forces.forEach(function (f) {
        var b = App.member(f.id);
        h += '<tr><td>' + f.id + '</td><td>' + b.i + ' – ' + b.j + '</td><td>' + fmt(f.L, 3) + '</td><td>' + fmt(deg(Math.atan2(f.s, f.c)), 1) + '</td><td>' + fmt(f.N, 1) + '</td><td>' + t('kind_' + f.kind) + '</td><td>' + fmt(b.w, 0) + '</td><td>' + fmt(QST.csa.memberArea(b), 0) + '</td></tr>';
      });
      h += '</tbody></table>';
      var sx = 0, sy = 0;
      h += '<table style="margin-top:8px"><thead><tr><th>' + t('node') + '</th><th>Rx (kN)</th><th>Ry (kN)</th></tr></thead><tbody>';
      r.reactions.forEach(function (R) { sx += R.rx; sy += R.ry; h += '<tr><td>' + R.node + '</td><td>' + fmt(R.rx, 1) + '</td><td>' + fmt(R.ry, 1) + '</td></tr>'; });
      h += '<tr><td>Σ ' + t('reactions') + ' / Σ ' + t('loads') + '</td><td>' + fmt(sx, 1) + ' / ' + fmt(r.sumLoads.fx, 1) + '</td><td>' + fmt(sy, 1) + ' / ' + fmt(r.sumLoads.fy, 1) + '</td></tr></tbody></table>';
      h += '<p>' + (r.indeterminacy === 0 ? t('determinate') : t('indeterminate') + ' (r = ' + r.indeterminacy + ')') + ' · ' + t('residual') + ' ' + r.globalResidual.toExponential(1) + ' kN</p>';

      h += '<h2>4. ' + t('rpChecks') + '</h2><div class="rp-figure">' + App.staticSVG({ mode: 'util', width: 1000, grid: false }) + '</div>';
      h += '<table class="rp-calc"><thead><tr><th>' + t('element') + '</th><th>' + t('calc') + '</th><th>' + t('utilShort') + '</th></tr></thead><tbody>';
      c.members.forEach(function (e) {
        if (e.kind === 'zero') return;
        var calc;
        if (e.kind === 'tie') {
          calc = '<span class="rp-eq">Tr = φs fy As = ' + fmt(c.phiS, 2) + ' × ' + fmt(mat.fy, 0) + ' × ' + fmt(e.As, 0) + ' = ' + fmt(e.capacity, 0) + ' kN ≥ Tf = ' + fmt(e.demand, 0) + ' kN</span> <small>(' + code.clause.tie + ')</small>';
        } else {
          var g = e.ends.filter(function (x) { return x.node === e.governingEnd; })[0];
          calc = (g.tie ? '<span class="rp-eq">ε1 = ' + fmt(g.epsS * 1000, 3) + '‰ + (' + fmt(g.epsS * 1000, 3) + '‰ + 2‰) cot²(' + fmt(deg(g.theta), 1) + '°) = ' + fmt(g.eps1 * 1000, 3) + '‰ ; fcu = ' + fmt(mat.fc, 1) + ' / (' + App.dl('0,8') + ' + 170 ε1) = ' + fmt(g.fcuRaw, 2) + (g.capped ? ' → ' + App.capLabel() : '') + ' = ' + fmt(g.fcu, 2) + ' MPa</span><br>' : t('noTieAtEnd') + ' → fcu = ' + App.capLabel() + ' = ' + fmt(g.fcu, 2) + ' MPa<br>') +
            '<span class="rp-eq">Cr = φc fcu w b = ' + fmt(c.phiC, 2) + ' × ' + fmt(e.fcu, 2) + ' × ' + fmt(e.w, 0) + ' × ' + fmt(mat.b, 0) + ' = ' + fmt(e.capacity, 0) + ' kN ≥ Cf = ' + fmt(e.demand, 0) + ' kN</span> <small>(' + code.clause.strut + ', ' + t('end') + ' ' + e.governingEnd + ')</small>';
        }
        h += '<tr><td>' + e.id + '<br><small>' + t('kind_' + e.kind) + '</small></td><td>' + calc + '</td><td>' + ok(e.util) + '</td></tr>';
      });
      c.nodes.forEach(function (e) {
        var g = e.governingFace;
        var calc = '<span class="rp-eq">' + e.type + ' : f<sub>lim</sub> = ' + App.nodeFactorText(e.type) + ' φc f′c = ' + fmt(e.limit, 2) + ' MPa' + (g ? ' ; σ = ' + fmt(g.force, 0) + ' kN / (' + fmt(g.width, 0) + ' × ' + fmt(mat.b, 0) + ') = ' + fmt(g.stress, 2) + ' MPa (' + t('face_' + g.kind) + (g.kind === 'strut' || g.kind === 'tie' ? ' ' + g.ref : '') + ')' : '') + '</span> <small>(' + code.clause.node + ')</small>';
        h += '<tr><td>' + e.id + '<br><small>' + t('nodalZone') + '</small></td><td>' + calc + '</td><td>' + ok(e.util) + '</td></tr>';
      });
      c.anchors.forEach(function (a) {
        var calc = a.mechanical ? t('anchor_' + a.type) + ' — ' + t(a.type === 'continuous' ? 'continuousNote' : 'mechanicalNote') : a.na ? t('dbUnknown') :
          '<span class="rp-eq">l<sub>a</sub> = ' + fmt(a.dc, 0) + ' + ' + fmt(a.e, 0) + ' = ' + fmt(a.la, 0) + ' mm ≥ ' + (a.type === 'hook' ? 'l<sub>dh</sub>' : 'l<sub>d</sub>') + ' = ' + fmt(a.req, 0) + ' mm (d<sub>b</sub> = ' + fmt(a.db, 1) + ' mm' + (a.top ? ', k1 = 1,3' : '') + ')</span>';
        h += '<tr><td>' + a.member + ' · ' + a.node + '<br><small>' + t('anchorage') + '</small></td><td>' + calc + ' <small>(' + a.clause + ')</small></td><td>' + (a.mechanical || a.na ? '—' : ok(a.util)) + '</td></tr>';
      });
      var ck = c.crack;
      h += '<tr><td>' + t('crackControl') + '</td><td>ρh = ' + fmt(ck.rhoH, 4) + ', ρv = ' + fmt(ck.rhoV, 4) + ' ≥ ' + fmt(ck.rhoMin, 4) + ' ; s = ' + fmt(ck.spacing, 0) + ' ≤ ' + fmt(ck.sMax, 0) + ' mm <small>(' + ck.clause + ')</small></td><td>' + ok(ck.util) + '</td></tr>';
      h += '</tbody></table>';
      h += '<p><b>' + t('mUtil') + ' : ' + fmt(c.maxUtil, 2) + '</b> (' + (c.governing.kind === 'node' ? t('node') : c.governing.kind === 'anchor' ? t('anchorage') : t('kind_' + c.governing.kind)) + ' ' + c.governing.id + ')</p>';
      var zones = c.nodes.filter(function (e) { return e.zone; });
      if (zones.length) {
        h += '<h2>5. ' + t('hydroZones') + '</h2><table><thead><tr><th>' + t('node') + '</th><th>σ<sub>h</sub> (MPa)</th><th>' + t('face') + ' : F (kN) · w → w<sub>h</sub> (mm)</th></tr></thead><tbody>';
        zones.forEach(function (e) {
          h += '<tr><td>' + e.id + ' (' + e.type + ')</td><td>' + fmt(e.zone.sigma, 2) + '</td><td>' + e.zone.faces.map(function (fa) { return t('face_' + fa.kind) + (fa.kind === 'strut' || fa.kind === 'tie' ? ' ' + fa.ref : '') + ' : ' + fmt(fa.force, 0) + ' · ' + (fa.wGiven > 0 ? fmt(fa.wGiven, 0) : '—') + ' → ' + fmt(fa.wHydro, 0); }).join(' ; ') + (e.zone.outside ? ' <span class="rp-bad">' + t('zoneOutside') + '</span>' : '') + '</td></tr>';
        });
        h += '</tbody></table>';
      }
      var pl = QST.templates.pileLoads(App.model, r, window.QST_META);
      if (pl && App.model.meta && App.model.meta.pileMap) {
        h += '<h2>6. ' + t('pileLoadsTitle') + '</h2><table><thead><tr><th>' + t('pile') + '</th><th>N (kN)</th><th>H (kN)</th></tr></thead><tbody>';
        pl.piles.forEach(function (q) { h += '<tr><td>' + q.id + '</td><td>' + fmt(q.N, 1) + '</td><td>' + fmt(q.H, 1) + '</td></tr>'; });
        h += '</tbody></table><p>' + t('pileNote') + '</p>';
      }
      if (App.warnings.length) h += '<p class="rp-bad">' + t('outsideMsg') + ' ' + App.warnings.map(function (w) { return w.id; }).join(', ') + '</p>';
    }
    h += '<div class="rp-disclaimer"><b>' + t('warning') + '</b><br>' + t('reportDisclaimer') + '</div>';
    return h;
  };

  App.printReport = function () {
    document.getElementById('report').innerHTML = App.buildReport();
    setTimeout(function () { window.print(); }, 60);
  };

  App.exportPileLoads = function () {
    var data = QST.templates.pileLoads(App.model, App.result, window.QST_META);
    if (!data || !data.piles.length) { App.toast(App.t('noPiles')); return; }
    App.download(App.fileBase() + '-quickerpile.json', JSON.stringify(data, null, 2), 'application/json');
    App.toast(App.t('pileExported').replace('{n}', data.piles.length));
  };

  App.exportCSV = function () {
    var t = App.t, r = App.result, c = App.checks, sep = App.lang === 'fr' ? ';' : ',';
    var num = function (v, d) { return isFinite(v) ? Number(v).toFixed(d).replace('.', App.lang === 'fr' ? ',' : '.') : ''; };
    var rows = [[t('element'), t('type'), 'N (kN)', t('resistance') + ' (kN | MPa)', t('utilShort'), t('clause')]];
    if (r && r.ok) {
      c.members.forEach(function (e) { rows.push([e.id, t('kind_' + e.kind), num(e.kind === 'strut' ? -e.demand : e.demand, 1), num(e.capacity, 1), num(e.util, 3), e.clause]); });
      c.nodes.forEach(function (e) { rows.push([e.id, e.type, e.governingFace ? num(e.governingFace.stress, 2) + ' MPa' : '', num(e.limit, 2), num(e.util, 3), e.clause]); });
    }
    var text = '﻿' + rows.map(function (row) { return row.map(function (v) { v = String(v); return /[";,\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(sep); }).join('\r\n');
    App.download(App.fileBase() + '-checks.csv', text, 'text/csv;charset=utf-8');
  };
})();

</script>
<script>/* js/main.js */
// SPDX-License-Identifier: GPL-3.0-or-later
/* QuickerStrut&Tie — start-up, language, menus, files and keyboard shortcuts. */
(function () {
  'use strict';
  var QST = window.QST, App = QST.App;
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  function applyLanguage() {
    document.documentElement.lang = App.lang;
    $$('[data-i18n]').forEach(function (el) { el.textContent = App.t(el.dataset.i18n); });
    $$('[data-i18n-title]').forEach(function (el) { el.title = App.t(el.dataset.i18nTitle); el.setAttribute('aria-label', App.t(el.dataset.i18nTitle)); });
    $('#lang-fr').classList.toggle('selected', App.lang === 'fr');
    $('#lang-en').classList.toggle('selected', App.lang === 'en');
    var meta = window.QST_META || {};
    $('#release-version').textContent = 'v' + meta.version + ' · ' + meta.author;
    $('#release-date').textContent = App.t('released') + ' ' + meta.date;
    $('#footer-version').textContent = 'QuickerStrut&Tie v' + meta.version + ' · ' + meta.date;
    $('#method-body').innerHTML = App.t('methodHtml');
    $('#project-name').placeholder = App.t('untitled');
    $('#autosave-state').textContent = App.t('autosaved');
    App.renderAllText();
    App.renderCanvas();
  }

  function closeMenus(except) {
    $$('.qst-menu.open').forEach(function (m) { if (m !== except) { m.classList.remove('open'); m.querySelector('[data-menu-toggle]').setAttribute('aria-expanded', 'false'); } });
  }

  function confirmDialog(title, body, okLabel) {
    return new Promise(function (resolve) {
      var d = $('#confirm-dialog');
      $('#confirm-title').textContent = title; $('#confirm-body').textContent = body; $('#confirm-ok').textContent = okLabel;
      d.returnValue = '';
      d.onclose = function () { resolve(d.returnValue === 'ok'); };
      d.showModal();
    });
  }
  function guard(action) {
    if (!App.dirty) return Promise.resolve(true);
    return confirmDialog(App.t('unsavedTitle'), App.t('unsavedBody'), App.t('discard'));
  }

  function saveProject() {
    var data = { app: 'QuickerStrut&Tie', version: (window.QST_META || {}).version, schema: 1, savedAt: new Date().toISOString(), model: App.model };
    App.download(App.fileBase() + '.quickerstrut.json', JSON.stringify(data, null, 1), 'application/json');
    App.dirty = false; App.update({ inputs: true });
    App.toast(App.t('saved'));
  }
  function openFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var o = JSON.parse(reader.result), model = o.model || o;
        if (!model || !Array.isArray(model.nodes)) throw new Error('format');
        App.load(model);
        App.toast(App.t('opened') + ' · ' + file.name);
      } catch (e) { App.toast(App.t('openError')); }
    };
    reader.readAsText(file);
  }


  // ---------------------------------------------------------------- templates
  var TPL = {
    dappedEnd: [['h', 'm'], ['hn', 'm'], ['ln', 'm'], ['a', 'm'], ['half', 'm'], ['R', 'kN'], ['n', ''], ['b', 'mm'], ['fc', 'MPa']],
    bentCap: [['ncol', ''], ['spacing', 'm'], ['overhang', 'm'], ['h', 'm'], ['colWidth', 'm'], ['nGirders', ''], ['girderSpacing', 'm'], ['P', 'kN'], ['b', 'mm'], ['fc', 'MPa']],
    pileCap: [['np', ''], ['s', 'm'], ['edge', 'm'], ['h', 'm'], ['colWidth', 'm'], ['pileD', 'm'], ['P', 'kN'], ['fc', 'MPa']]
  };
  var tplState = { kind: 'dappedEnd', params: {} };
  Object.keys(TPL).forEach(function (k) { tplState.params[k] = Object.assign({}, QST.templates.DEFAULTS[k]); });

  function tplGenerate() {
    var g = QST.templates[tplState.kind](tplState.params[tplState.kind]);
    var m = App.sanitize(g.model);
    m.meta = g.model.meta;
    var info = QST.templates.autoSize(m);
    QST.csa.normalize(m);
    var r = QST.solver.solve(m), c = QST.csa.check(m, r);
    return { model: m, result: r, checks: c, errors: g.errors, info: info };
  }
  function tplRender() {
    var t = App.t, fmt = App.fmt;
    $('#tpl-kinds').innerHTML = Object.keys(TPL).map(function (k) {
      return '<button type="button" class="tpl-kind' + (k === tplState.kind ? ' active' : '') + '" data-kind="' + k + '"><b>' + t('tpl_' + k) + '</b><small>' + t('tplSub_' + k) + '</small></button>';
    }).join('');
    var p = tplState.params[tplState.kind];
    $('#tpl-form').innerHTML = '<div class="field-row">' + TPL[tplState.kind].map(function (f) {
      if (f[0] === 'np') return '<label class="field"><span>' + t('tf_np') + '</span><select data-tf="np">' + [2, 3, 4].map(function (n) { return '<option' + (p.np === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></label>';
      return '<label class="field"><span>' + t('tf_' + f[0]) + '</span><span class="unit-wrap"><input class="num" inputmode="decimal" data-tf="' + f[0] + '" value="' + App.esc(App.fmtInput(p[f[0]])) + '"><i>' + f[1] + '</i></span></label>';
    }).join('') + '</div>';
    tplPreview();
  }
  function tplPreview() {
    var t = App.t, fmt = App.fmt, g;
    try { g = tplGenerate(); } catch (e) { $('#tpl-svg').innerHTML = ''; $('#tpl-info').innerHTML = '<span class="bad">' + App.esc(e.message) + '</span>'; return; }
    $('#tpl-svg').innerHTML = App.staticSVG({ model: g.model, result: g.result, checks: g.checks, mode: 'forces', width: 760, height: 380, grid: false, ids: false, pad: { l: 40, r: 40, t: 60, b: 50 } });
    var h = '';
    if (g.errors.length) h += '<div class="bad">⚠ ' + g.errors.map(function (e) { return t('tplErr_' + e); }).join(' · ') + '</div>';
    if (!g.result.ok) h += '<div class="bad">' + t('mechanism') + '</div>';
    else h += '<div><b>' + t('mUtil') + ' ' + fmt(g.checks.maxUtil, 2) + '</b> · ' + (g.result.indeterminacy === 0 ? t('determinate') : t('indeterminate') + ' (r = ' + g.result.indeterminacy + ')') + ' · ' + g.model.nodes.length + ' ' + t('nodesLc') + ' · ' + g.model.members.length + ' ' + t('membersLc') + '</div>';
    h += '<div>' + t('tplNote_' + tplState.kind) + '</div><div>' + t('tplAutoNote') + '</div>';
    $('#tpl-info').innerHTML = h;
  }
  function bindTemplates() {
    $('#open-templates').addEventListener('click', function () { closeMenus(); tplRender(); $('#tpl-dialog').showModal(); });
    $('#tpl-kinds').addEventListener('click', function (e) { var b = e.target.closest('[data-kind]'); if (!b) return; tplState.kind = b.dataset.kind; tplRender(); });
    $('#tpl-form').addEventListener('change', function (e) {
      var el = e.target, k = el.dataset.tf; if (!k) return;
      var v = el.tagName === 'SELECT' ? Number(el.value) : App.parse(el.value);
      if (!(isFinite(v) && v > 0)) { el.classList.add('num-err'); return; }
      el.classList.remove('num-err');
      tplState.params[tplState.kind][k] = v;
      tplPreview();
    });
    $('#tpl-form').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
    $('#tpl-create').addEventListener('click', function () {
      var g = tplGenerate();
      guard().then(function (go) {
        if (!go) return;
        g.model.name = App.t('tpl_' + tplState.kind);
        App.load(g.model);
        $('#tpl-dialog').close();
        App.toast(App.t('tplCreated'));
      });
    });
  }

  function bind() {
    $('#lang-fr').addEventListener('click', function () { App.setLang('fr'); applyLanguage(); });
    $('#lang-en').addEventListener('click', function () { App.setLang('en'); applyLanguage(); });
    $$('[data-menu-toggle]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var menu = b.closest('.qst-menu'), open = !menu.classList.contains('open');
        closeMenus(menu); menu.classList.toggle('open', open); b.setAttribute('aria-expanded', String(open));
        // Keep the whole list reachable on short screens: the pop-up scrolls instead of leaving the viewport.
        var pop = menu.querySelector('.menu-pop');
        if (open && pop) pop.style.maxHeight = Math.max(160, window.innerHeight - pop.getBoundingClientRect().top - 12) + 'px';
      });
    });
    document.addEventListener('click', function (e) { if (!e.target.closest('.qst-menu')) closeMenus(); });
    $('#examples-list').addEventListener('click', function (e) {
      var b = e.target.closest('[data-example]'); if (!b) return;
      closeMenus();
      guard().then(function (go) { if (go) { App.load(QST.examples.build(b.dataset.example, App.lang)); App.toast(App.t('exampleLoaded')); } });
    });
    $('#new-project').addEventListener('click', function () {
      closeMenus();
      guard().then(function (go) { if (go) { var m = QST.examples.blank(); m.name = ''; App.load(m); App.setTool('node'); } });
    });
    $('#reset').addEventListener('click', function () {
      confirmDialog(App.t('resetTitle'), App.t('resetBody'), App.t('reset')).then(function (go) { if (go) App.load(QST.examples.build('deep-beam-1', App.lang)); });
    });
    $('#open-project').addEventListener('click', function () { closeMenus(); guard().then(function (go) { if (go) $('#project-file').click(); }); });
    $('#project-file').addEventListener('change', function (e) { var f = e.target.files[0]; if (f) openFile(f); e.target.value = ''; });
    $('#save-project').addEventListener('click', function () { closeMenus(); saveProject(); });
    $('#print-report').addEventListener('click', function () { closeMenus(); App.printReport(); });
    $('#export-svg').addEventListener('click', function () { closeMenus(); App.download(App.fileBase() + '-' + App.display.mode + '.svg', App.staticSVG({ mode: App.display.mode === 'geometry' ? 'forces' : App.display.mode }), 'image/svg+xml'); });
    $('#export-csv').addEventListener('click', function () { closeMenus(); App.exportCSV(); });
    $('#export-pile-menu').addEventListener('click', function () { closeMenus(); App.exportPileLoads(); });
    bindTemplates();
    $('#method-open').addEventListener('click', function () { $('#method-dialog').showModal(); });
    $$('dialog [data-close]').forEach(function (b) { b.addEventListener('click', function () { b.closest('dialog').close(); }); });
    $('#method-dialog').addEventListener('click', function (e) { if (e.target === e.currentTarget) e.currentTarget.close(); });
    window.addEventListener('beforeprint', function () { var r = $('#report'); if (!r.innerHTML) r.innerHTML = App.buildReport(); });
    window.addEventListener('afterprint', function () { $('#report').innerHTML = ''; });
    // Drop a project file anywhere on the page.
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    document.addEventListener('drop', function (e) { e.preventDefault(); var f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) guard().then(function (go) { if (go) openFile(f); }); });

    document.addEventListener('keydown', function (e) {
      var tag = document.activeElement && document.activeElement.tagName;
      var typing = /INPUT|SELECT|TEXTAREA/.test(tag) || document.querySelector('dialog[open]');
      var mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveProject(); return; }
      if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); $('#open-project').click(); return; }
      if (mod && e.key.toLowerCase() === 'p') { e.preventDefault(); App.printReport(); return; }
      if (typing) return;
      if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) App.redo(); else App.undo(); return; }
      if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); App.redo(); return; }
      if (mod) return;
      var tools = { v: 'select', n: 'node', b: 'member', s: 'support', l: 'load', c: 'outline', e: 'erase' };
      var k = e.key.toLowerCase();
      if (tools[k]) { App.setTool(tools[k]); return; }
      if (k === 'f') { App.fit(); return; }
      if (k === '1') { App.display.mode = 'geometry'; App.saveUi(); App.update(); return; }
      if (k === '2') { App.display.mode = 'forces'; App.saveUi(); App.update(); return; }
      if (k === '3') { App.display.mode = 'util'; App.saveUi(); App.update(); return; }
      if (k === '+' || k === '=') { App.zoom(1.2); return; }
      if (k === '-') { App.zoom(1 / 1.2); return; }
      if (e.key === 'Escape') { App.cancelPending(); if (App.tool !== 'select') App.setTool('select'); else { App.sel = null; App.emitSelection(); } return; }
      if ((e.key === 'Delete' || e.key === 'Backspace') && App.sel) {
        e.preventDefault();
        App.commit();
        if (App.sel.type === 'node') App.deleteNode(App.sel.id);
        else if (App.sel.type === 'member') App.deleteMember(App.sel.id);
        else if (App.sel.type === 'vertex' && App.model.outline.length > 3) App.model.outline.splice(App.sel.index, 1);
        App.sel = null; App.update({ inputs: true }); return;
      }
      var arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] };
      if (arrows[e.key] && App.sel) { e.preventDefault(); App.nudge(arrows[e.key][0], arrows[e.key][1]); }
    });
  }

  function start() {
    App.restoreUi();
    if (!App.restore()) App.model = App.sanitize(QST.examples.build('deep-beam-1', App.lang));
    App.compute();
    App.initPanels();
    App.initCanvas();
    bind();
    applyLanguage();
    App.update({ inputs: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
