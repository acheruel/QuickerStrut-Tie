<script>
/* Intro: a deep beam strut-and-tie model is drawn and its forces appear (2.4 s). */
(function(){
  'use strict';
  var root=document.getElementById('splash');if(!root)return;
  var lang='fr';try{var s=localStorage.getItem('qst-lang');if(s==='en'||s==='fr')lang=s;else if(!/^fr/i.test(navigator.language||'fr'))lang='en';}catch(e){}
  var $=function(i){return document.getElementById(i);};
  $('sp-tagline').textContent=lang==='fr'?'BIELLES ET TIRANTS · CSA S6 / A23.3':'STRUT-AND-TIE · CSA S6 / A23.3';
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var D=2400,t0=performance.now(),done=false;
  var ease=function(u){u=Math.max(0,Math.min(1,u));return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;};
  var fmt=function(v){return Math.round(v).toLocaleString(lang==='fr'?'fr-CA':'en-CA');};
  function band(id,x1,y1,x2,y2,w,p){var dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L*w/2,ny=dx/L*w/2,ex=x1+dx*p,ey=y1+dy*p;
    $(id).setAttribute('d','M'+(x1+nx)+' '+(y1+ny)+'L'+(ex+nx)+' '+(ey+ny)+'L'+(ex-nx)+' '+(ey-ny)+'L'+(x1-nx)+' '+(y1-ny)+'Z');}
  function frame(now){
    var t=reduce?D:now-t0;
    $('sp-gridl').setAttribute('opacity',(.5*ease(t/500)).toFixed(3));
    $('sp-concrete').setAttribute('opacity',ease((t-150)/400).toFixed(3));
    $('sp-nodes').setAttribute('opacity',ease((t-400)/300).toFixed(3));
    var l=ease((t-500)/450);$('sp-load').setAttribute('y2',(120+88*l).toFixed(1));
    var s=ease((t-800)/600);
    $('sp-strut-l').setAttribute('x2',(500-165*s).toFixed(1));$('sp-strut-l').setAttribute('y2',(225+180*s).toFixed(1));
    $('sp-strut-r').setAttribute('x2',(500+165*s).toFixed(1));$('sp-strut-r').setAttribute('y2',(225+180*s).toFixed(1));
    band('sp-band-l',500,225,335,405,34,s);band('sp-band-r',500,225,665,405,34,s);
    var ti=ease((t-1150)/550);$('sp-tie').setAttribute('x2',(335+330*ti).toFixed(1));$('sp-band-t').setAttribute('width',(330*ti).toFixed(1));
    var f=ease((t-1350)/700);$('sp-c').setAttribute('opacity',f.toFixed(2));$('sp-t').setAttribute('opacity',f.toFixed(2));
    $('sp-c').textContent='C '+fmt(1414*f)+' kN';$('sp-t').textContent='T '+fmt(1000*f)+' kN';
    var b=ease((t-1500)/600);$('sp-brand').setAttribute('opacity',b.toFixed(3));$('sp-brand').setAttribute('transform','translate(0 '+(8*(1-b)).toFixed(2)+')');
    if(t>=D){finish();return;}
    requestAnimationFrame(frame);
  }
  function finish(){if(done)return;done=true;document.body.classList.add('reveal');setTimeout(function(){document.body.classList.remove('reveal');},1500);root.classList.add('out');setTimeout(function(){root.remove();},600);}
  $('splash-skip').addEventListener('click',finish);
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){finish();document.removeEventListener('keydown',k);}});
  requestAnimationFrame(frame);
})();
</script>
